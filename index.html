<style>
/* Layout: answer-sheet motif — a quiet home of mode cards, then a focused test screen with a sticky timer bar; reading splits passage | question on wide screens. */
:root{
  --paper:#F3F6F5; --card:#FFFFFF; --ink:#14231F; --muted:#5A6B66; --line:#D3DDDA;
  --accent:#0F6E5A; --accent-ink:#FFFFFF; --mark:#F2C94C; --ok:#1E7F4F; --bad:#B4372F;
  --ok-bg:#E3F3EA; --bad-bg:#FBE7E5; --soft:#E8EFED;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1614; --card:#15201D; --ink:#E4EDEA; --muted:#93A5A0; --line:#273632;
  --accent:#3DBE9C; --accent-ink:#06120F; --mark:#E2B93B; --ok:#4CC38A; --bad:#F07167;
  --ok-bg:#15302A; --bad-bg:#3A1E1C; --soft:#1B2925; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1614; --card:#15201D; --ink:#E4EDEA; --muted:#93A5A0; --line:#273632;
  --accent:#3DBE9C; --accent-ink:#06120F; --mark:#E2B93B; --ok:#4CC38A; --bad:#F07167;
  --ok-bg:#15302A; --bad-bg:#3A1E1C; --soft:#1B2925; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:600}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:12px 26px;border-bottom:2px solid var(--ink)}
.hero p.lede{font-family:var(--serif);font-size:17px;max-width:58ch;margin-top:12px;color:var(--muted)}
.scorebox{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.scorebox div{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.scorebox div:last-child{border-right:0}
.scorebox b{display:block;font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;font-weight:600}
.scorebox span{font-size:12px;color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mode .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mode p{font-size:14px;color:var(--muted);flex:1}
.mode.sim{border-color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;margin-top:12px}
.skill{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font-size:13.5px;min-width:0}
.skill .n{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:2.2em}
.skill[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.skill[aria-pressed="true"] .n{color:var(--accent);font-weight:600}
.skill .c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.history{width:100%;border-collapse:collapse;font-size:14px}
.history td,.history th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.history th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.note{font-family:var(--serif);font-size:14px;color:var(--muted);max-width:75ch}
.formatgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.formatgrid .panel h3{margin-bottom:6px}
.formatgrid ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}

/* test screen */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .inner{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .title{font-weight:700;flex:1;min-width:0}
.bar .title small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.06em}
.timer{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.stage{display:grid;gap:20px;margin-top:20px}
.stage.split{grid-template-columns:1.15fr 1fr;align-items:start}
.passage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;font-family:var(--serif);font-size:16.5px;line-height:1.7;max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:90px;min-width:0}
.passage h3{font-family:var(--display);margin-bottom:10px}
.passage p{position:relative;margin-bottom:12px;display:grid;grid-template-columns:2em 1fr;gap:4px}
.passage p .pn{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:5px}
mark.hl{background:var(--mark);color:#14231F;padding:0 2px;border-radius:2px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qtag{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.qtext{font-family:var(--serif);font-size:18px;line-height:1.75;margin-bottom:18px}
.blank{display:inline-block;min-width:5em;border-bottom:2px solid var(--ink);vertical-align:baseline}
.ul{white-space:nowrap}
.ul u{text-decoration:none;border-bottom:2px solid var(--ink);padding-bottom:1px}
.ul sub{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);margin-left:2px;vertical-align:-0.4em}
.ul.isbad u{border-color:var(--bad);color:var(--bad)}
.ul.isok u{border-color:var(--ok)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 12px;font-family:var(--serif);font-size:16px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.bub{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;margin-top:-1px}
.opt.sel .bub{background:var(--ink);color:var(--paper)}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--soft);font-family:var(--serif);font-size:15px;line-height:1.6}
.explain b.v{font-family:var(--display)}
.explain .ok{color:var(--ok)} .explain .bad{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:16px}
.cell{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-family:var(--mono);font-size:12px;position:relative}
.cell.ans{background:var(--soft);border-color:var(--muted)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.flag::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--mark)}
.cell.c-ok{background:var(--ok-bg);border-color:var(--ok)}
.cell.c-bad{background:var(--bad-bg);border-color:var(--bad)}
.confirm{margin-top:14px;padding:14px;border:1px solid var(--bad);border-radius:8px;background:var(--bad-bg)}

/* result */
.result-top{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.bigscore{font-family:var(--mono);font-size:56px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bigscore small{font-size:18px;color:var(--muted)}
.bars{display:grid;gap:6px}
.sbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:10px;align-items:center;font-size:13.5px}
.sbar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.sbar .track i{display:block;height:100%;background:var(--accent)}
.sbar .track i.lo{background:var(--bad)}
.review{display:grid;gap:12px}
.ritem{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:14px;background:var(--card)}
.ritem.bad{border-left-color:var(--bad)}
.ritem .qtext{font-size:16px;margin-bottom:8px}
.filter{margin-left:auto}
.audio{display:grid;gap:8px;padding:12px 14px;margin-bottom:16px;border:1px dashed var(--accent);border-radius:8px;background:var(--soft)}
.pulse{font-weight:600;color:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.warn{font-size:13.5px;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:8px 10px;margin-top:10px}
details.script{margin-top:10px;font-family:var(--serif);font-size:14.5px}
details.script summary{cursor:pointer;font-family:var(--display);font-weight:600;color:var(--accent)}
details.script p{margin-top:6px}
/* flash card */
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.lg{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--line);margin:0 4px 0 10px;vertical-align:0}
.k-hafal{background:var(--ok)} .k-proses{background:var(--mark)} .k-belum{background:var(--bad)}
.lg:first-child{margin-left:0}
.fc{perspective:1200px;cursor:pointer;max-width:560px;margin:20px auto 0;border-radius:14px}
.fc:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.fc-inner{position:relative;height:320px;transition:transform .5s ease;transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;overflow:auto}
.fc-face.back{transform:rotateY(180deg);border-color:var(--accent)}
.fc-word{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.01em;line-height:1.1;overflow-wrap:anywhere}
.fc-word.sm{font-size:22px}
.fc-word.id{font-family:var(--serif);font-weight:600;font-size:clamp(24px,5vw,34px)}
.fc-pos{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fc-arti{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--accent)}
.fc-syn{font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;justify-content:center}
.fc-ex{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px;max-width:44ch}
.fc-hint{font-size:12.5px;color:var(--muted)}
.fc-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn.say{font-size:13px;padding:6px 12px}
.btn.r1{border-color:var(--bad);color:var(--bad)}
.btn.r2{border-color:var(--mark)}
.btn.r3{background:var(--ok);border-color:var(--ok);color:var(--card)}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .scorebox{grid-template-columns:repeat(2,1fr)}
  .scorebox div:nth-child(2){border-right:0}
  .scorebox div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .stage.split{grid-template-columns:1fr}
  .passage{position:static;max-height:46vh}
  .result-top{grid-template-columns:1fr}
  .sbar{grid-template-columns:minmax(0,1fr) 70px 44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* =========================================================
   SKILL MAP — mengikuti kerangka Longman Complete Course
   ========================================================= */
const SKILLS = {
  st: {
    1:"Pastikan kalimat punya subjek & verba", 2:"Waspadai objek preposisi", 3:"Waspadai appositive",
    4:"Waspadai present participle", 5:"Waspadai past participle", 6:"Coordinate connector (and, but, so, yet)",
    7:"Adverb connector waktu & sebab", 8:"Adverb connector lain (although, even though)", 9:"Noun clause connector",
    10:"Noun clause connector/subject", 11:"Adjective clause connector", 12:"Adjective clause connector/subject",
    13:"Reduced adjective clause", 14:"Reduced adverb clause", 15:"Inversi dengan question word",
    16:"Inversi dengan keterangan tempat", 17:"Inversi dengan kata negatif", 18:"Inversi dengan conditional",
    19:"Inversi dengan perbandingan",
    61:"Urutan kata (word order)", 62:"Infinitive & gerund", 63:"Modifier yang salah tempat (dangling)",

  },
  we: {
    20:"Agreement setelah prepositional phrase", 21:"Agreement setelah ungkapan kuantitas", 22:"Agreement pada verba terinversi",
    23:"Agreement setelah kata tertentu (each, everybody)", 24:"Paralel dengan coordinate conjunction", 25:"Paralel dengan paired conjunction",
    26:"Paralel dengan perbandingan", 27:"Bentuk comparative & superlative", 28:"Penggunaan comparative & superlative",
    29:"Struktur the -er, the -er", 30:"Setelah have → past participle", 31:"Setelah be → -ing / V3",
    32:"Setelah modal → verba dasar", 33:"Past vs present", 34:"Penggunaan have & had",
    35:"Tense dengan keterangan waktu", 36:"Tense dengan will & would", 37:"Bentuk passive",
    38:"Makna aktif vs pasif", 39:"Noun tunggal vs jamak", 40:"Countable vs uncountable",
    41:"Plural tak beraturan", 42:"Orang vs benda", 43:"Subject vs object pronoun",
    44:"Possessive adjective vs pronoun", 45:"Rujukan pronoun", 46:"Adjective vs adverb dasar",
    47:"Adjective setelah linking verb", 48:"Posisi adjective & adverb", 49:"Adjective berakhiran -ly",
    50:"Predicate adjective (alive, asleep)", 51:"Adjective -ed vs -ing", 52:"Article dengan noun tunggal",
    53:"a vs an", 54:"Article sesuai noun", 55:"Ide spesifik vs umum",
    56:"Preposisi yang salah", 57:"Preposisi yang hilang", 58:"make vs do",
    59:"like, alike, unlike", 60:"other, another, others",
    66:"Bentuk kata (word form)", 67:"Pilihan kata (so/such, too/very, much/many)", 68:"Verbal: to + V atau -ing setelah verba tertentu",
    69:"Agreement dengan or/nor & noun berakhiran -s", 70:"Double negative", 71:"Kata yang sering tertukar (its/it's, good/well)",
    72:"Bentuk irregular verb"
  },
  rd: {
    1:"Main idea", 2:"Organisasi ide", 3:"Stated detail", 4:"Unstated detail (NOT/EXCEPT)",
    5:"Pronoun referent", 6:"Implied detail (inference)", 7:"Transisi / paragraf berikutnya",
    8:"Definisi dari petunjuk struktur", 9:"Makna dari bagian kata", 10:"Kosakata sulit dari konteks",
    11:"Kosakata sederhana dari konteks", 12:"Lokasi informasi", 13:"Tone, tujuan, alur"
  }
};

/* =========================================================
   STRUCTURE — soal orisinal (bukan salinan buku)
   ========================================================= */
const ST = [
 {s:1,q:"_____ in the Arctic tundra during the brief summer months.",o:["Many wildflowers bloom","Blooming many wildflowers","Many wildflowers blooming","That many wildflowers bloom"],a:0,e:"Kalimat butuh subjek (many wildflowers) dan verba utama (bloom). Pilihan lain tidak punya verba utama, atau berubah menjadi noun clause yang tidak lengkap."},
 {s:1,q:"In the early twentieth century, the automobile _____ the way Americans lived and worked.",o:["changing","it changed","changed","to change"],a:2,e:"Subjek sudah ada (the automobile), jadi yang dibutuhkan verba utama: changed. 'It changed' membuat subjek ganda."},
 {s:1,q:"The human heart _____ about 100,000 times each day.",o:["beating","beats","to beat","which beats"],a:1,e:"Kalimat belum punya verba utama. 'Beating' dan 'to beat' bukan verba utama; 'which beats' membentuk klausa sehingga kalimat tetap tanpa verba utama."},
 {s:2,q:"With the development of the printing press, _____ more widely available to ordinary people.",o:["books became","becoming books","books becoming","the books that became"],a:0,e:"'The development of the printing press' adalah objek preposisi 'with', bukan subjek. Kalimat masih butuh subjek + verba: books became."},
 {s:2,q:"Despite heavy rainfall, _____ on schedule.",o:["the construction was completed","completing the construction","was completed the construction","the construction completed it"],a:0,e:"'Heavy rainfall' adalah objek preposisi 'despite'. Klausa utama perlu subjek + verba pasif yang benar: the construction was completed."},
 {s:3,q:"_____, Jupiter is more than eleven times as wide as Earth.",o:["The largest planet in the solar system","It is the largest planet in the solar system","Because the largest planet in the solar system","The largest planet in the solar system is"],a:0,e:"Frasa benda di depan koma adalah appositive yang menjelaskan Jupiter. Pilihan B dan D menambah verba sehingga terbentuk dua klausa tanpa konektor."},
 {s:3,q:"Marie Curie, _____, was the first person to win Nobel Prizes in two different sciences.",o:["she was a physicist and chemist","a physicist and chemist","was a physicist and chemist","who a physicist and chemist"],a:1,e:"Di antara dua koma dibutuhkan appositive (frasa benda) yang menjelaskan Marie Curie. 'Who' memerlukan verba (who was …)."},
 {s:4,q:"The children _____ in the park every afternoon live on the same street.",o:["play","are playing","playing","they play"],a:2,e:"Verba utama adalah 'live'. Bagian yang kosong harus berupa reduced clause: 'playing' (= who play). 'Play' atau 'are playing' menjadikan dua verba utama tanpa konektor."},
 {s:5,q:"The bridge _____ in 1883 connected Brooklyn and Manhattan for the first time.",o:["completed","was completed","completing","it was completed"],a:0,e:"Verba utama adalah 'connected'. 'Completed' di sini past participle (= which was completed). 'Completing' bermakna aktif, padahal jembatan diselesaikan (pasif)."},
 {s:5,q:"Most of the furniture _____ in the museum dates from the colonial period.",o:["displays","displayed","is displayed","has displayed"],a:1,e:"Verba utama adalah 'dates'. 'Displayed' adalah past participle bermakna pasif (furniture yang dipamerkan)."},
 {s:6,q:"The museum was closed for renovation, _____ visitors could still enter the gift shop.",o:["but","because of","in spite of","due to"],a:0,e:"Dua klausa lengkap dihubungkan dengan coordinate connector. 'Because of', 'in spite of', dan 'due to' adalah preposisi, jadi harus diikuti frasa benda, bukan klausa."},
 {s:6,q:"The test was difficult, _____ most students passed it.",o:["yet","because","so","since"],a:0,e:"Hubungan kedua klausa bersifat kontras (sulit, tetapi banyak yang lulus), sehingga 'yet' tepat. 'So' bermakna akibat dan tidak cocok."},
 {s:7,q:"_____ the temperature dropped below freezing, the pond turned to ice.",o:["During","When","Because of","At"],a:1,e:"Yang mengikuti adalah klausa (subjek + verba), jadi diperlukan adverb connector: when. 'During', 'because of', dan 'at' adalah preposisi."},
 {s:7,q:"The flight was delayed _____ a mechanical problem was discovered.",o:["because","because of","due to","owing to"],a:0,e:"Setelah titik kosong ada klausa lengkap, jadi gunakan konektor 'because'. 'Because of', 'due to', dan 'owing to' harus diikuti frasa benda."},
 {s:7,q:"_____ the invention of the refrigerator, people preserved food with ice and salt.",o:["Before","Before was","Before it","Before they"],a:0,e:"'Before' di sini berfungsi sebagai preposisi dan diikuti frasa benda (the invention …). Pilihan lain menghasilkan struktur yang rusak."},
 {s:8,q:"_____ the desert receives very little rain, many species of plants survive there.",o:["Despite","Even though","In spite of","Nevertheless"],a:1,e:"Kontras antara dua klausa memakai 'even though' (+ klausa). 'Despite/in spite of' + frasa benda; 'nevertheless' adalah transisi dan tidak menggabungkan klausa."},
 {s:9,q:"Scientists still do not know exactly _____ the dinosaurs became extinct.",o:["why","because","that why","for"],a:0,e:"Noun clause 'why the dinosaurs became extinct' menjadi objek 'know'. 'Because' adalah adverb connector, bukan noun clause connector."},
 {s:9,q:"_____ the company will expand overseas depends on next year's profits.",o:["Whether","If it","That if","Whether it"],a:0,e:"Noun clause sebagai subjek kalimat diawali 'whether'. 'If' tidak dipakai untuk noun clause di posisi subjek."},
 {s:9,q:"_____ is a mystery to many historians.",o:["Why the colony disappeared","The colony disappeared","Why did the colony disappear","Because the colony disappeared"],a:0,e:"Subjek kalimat berupa noun clause dengan susunan pernyataan: why + S + V. Susunan pertanyaan (why did …) salah dalam noun clause."},
 {s:10,q:"The detective finally discovered _____ in the locked room.",o:["what happened","what did happen it","that what happened","what it happened"],a:0,e:"'What' berfungsi sekaligus sebagai konektor dan subjek noun clause, jadi langsung diikuti verba: what happened."},
 {s:11,q:"Moby-Dick, _____ Herman Melville published in 1851, is now considered an American classic.",o:["which","that","it","what"],a:0,e:"Adjective clause non-restrictive (diapit koma) memakai 'which', bukan 'that'. 'Which' di sini konektor objek; subjeknya Herman Melville."},
 {s:12,q:"Students _____ submit their essays late will lose points.",o:["who","they","whom","which they"],a:0,e:"Diperlukan konektor yang juga menjadi subjek adjective clause untuk orang: who. 'Whom' adalah bentuk objek."},
 {s:12,q:"The engineer _____ designed the bridge received an award.",o:["who","whom","which","whose"],a:0,e:"'Who' menjadi subjek klausa 'who designed the bridge' dan merujuk pada orang (the engineer)."},
 {s:13,q:"The Rocky Mountains, _____ from New Mexico to Canada, are the largest mountain system in North America.",o:["extend","extending","are extending","they extend"],a:1,e:"Reduced adjective clause: 'which extend' diringkas menjadi 'extending'. Verba utamanya 'are'."},
 {s:14,q:"_____ the report, the manager realized that several figures were incorrect.",o:["After reading","After read","After he reading","After was reading"],a:0,e:"Reduced adverb clause: 'After he read' diringkas menjadi 'After reading'. Subjek yang dihilangkan sama dengan subjek klausa utama (the manager)."},
 {s:14,q:"_____ in 1636, Harvard is the oldest institution of higher learning in the United States.",o:["Founded","Founding","It was founded","When founding"],a:0,e:"Harvard didirikan (pasif), jadi bentuk ringkasnya past participle: Founded (= Because it was founded …). 'It was founded' membuat dua klausa tanpa konektor."},
 {s:15,q:"The professor asked the students what _____.",o:["did they understand","they understood","understood they","do they understand"],a:1,e:"Dalam noun clause (pertanyaan tidak langsung), susunannya pernyataan: what + subject + verb. Subjek dan verba tidak diinversi."},
 {s:16,q:"At the top of the hill _____, built more than two hundred years ago.",o:["stands an old church","an old church standing","does an old church stand","an old church stands it"],a:0,e:"Keterangan tempat di awal kalimat (At the top of the hill) diikuti inversi verba + subjek: stands an old church. Inversi tempat tidak memakai 'does'."},
 {s:17,q:"Rarely _____ snow in this part of the country.",o:["there is","is there","there has","does there"],a:1,e:"Kata negatif 'rarely' di awal kalimat menuntut inversi: is there."},
 {s:17,q:"Not until the twentieth century _____ to vote in national elections.",o:["women were allowed","were women allowed","women allowed","allowed women"],a:1,e:"'Not until …' di awal kalimat diikuti inversi auxiliary + subjek: were women allowed."},
 {s:18,q:"_____ more time, the team would have finished the project.",o:["Had they had","They had had","If they have","Had they"],a:0,e:"Conditional tipe 3 tanpa 'if' memakai inversi: Had they had (= If they had had). 'Had they' saja tidak punya verba utama."},
 {s:19,q:"Sound travels much faster through water than _____ through air.",o:["it does","does it","it is","is it"],a:0,e:"Setelah 'than', inversi hanya mungkin bila subjeknya noun (than does sound). Dengan pronoun 'it', susunan normal 'it does' yang tepat."},
 {s:1,q:"Every year, millions of migratory birds _____ thousands of kilometers between their breeding and wintering grounds.",o:["travel","traveling","to travel","which travel"],a:0,e:"Subjeknya 'millions of migratory birds' dan kalimat masih butuh verba utama: travel."},
 {s:2,q:"Throughout the history of medicine, _____ to understand the causes of disease.",o:["physicians have tried","trying physicians","have physicians tried","physicians trying"],a:0,e:"'The history of medicine' adalah objek preposisi. Klausa utama perlu subjek + verba: physicians have tried."},
 {s:3,q:"_____, the Amazon carries more water than any other river in the world.",o:["The second-longest river on Earth","It is the second-longest river on Earth","The second-longest river on Earth is","Although the second-longest river on Earth"],a:0,e:"Frasa benda di depan koma berfungsi sebagai appositive bagi 'the Amazon'. Pilihan lain menambah verba atau konektor tanpa klausa lengkap."},
 {s:4,q:"The scientists _____ the new vaccine published their results last month.",o:["testing","are testing","tested","they tested"],a:0,e:"Verba utamanya 'published'. 'Testing the new vaccine' adalah reduced clause (= who were testing). Pilihan lain menghasilkan dua verba utama."},
 {s:5,q:"Coffee _____ in Brazil is exported to many countries.",o:["grown","grows","is grown","growing"],a:0,e:"Verba utamanya 'is exported'. Kopi ditanam (pasif), jadi gunakan past participle: grown (= which is grown)."},
 {s:6,q:"Bats are not blind, _____ many of them rely on sound to navigate.",o:["but","despite","in spite of","regardless of"],a:0,e:"Dua klausa lengkap dihubungkan dengan coordinate connector 'but'. Pilihan lain adalah preposisi."},
 {s:7,q:"_____ the rain stopped, the workers continued repairing the road.",o:["As soon as","During","Due to","Prior to"],a:0,e:"Yang mengikuti adalah klausa (the rain stopped), jadi gunakan adverb connector waktu: as soon as. Pilihan lain adalah preposisi."},
 {s:8,q:"_____ it was expensive, the new equipment greatly improved the laboratory's accuracy.",o:["Although","Despite","However","In spite of"],a:0,e:"Kontras + klausa memakai 'although'. 'Despite/in spite of' + frasa benda; 'however' tidak menggabungkan klausa."},
 {s:10,q:"The guide explained _____ the ancient city's walls.",o:["who built","who did build","that who built","who it built"],a:0,e:"'Who' menjadi konektor sekaligus subjek noun clause, langsung diikuti verba: who built."},
 {s:10,q:"_____ caused the fire has not yet been determined.",o:["What","That","It","Which it"],a:0,e:"Subjek kalimat berupa noun clause 'what caused the fire'. 'What' sekaligus menjadi subjek klausa."},
 {s:11,q:"The village _____ my grandparents were born has changed very little.",o:["where","which","what","whose"],a:0,e:"Adjective clause tentang tempat yang sudah lengkap (my grandparents were born) memakai 'where'."},
 {s:11,q:"The plant _____ leaves are used to make tea grows in the highlands.",o:["whose","which","that its","who"],a:0,e:"Kepemilikan (daun milik tanaman itu) memakai 'whose'."},
 {s:13,q:"Any student _____ in the program must submit a medical certificate.",o:["enrolled","enrolls","is enrolled","who enrolled in"],a:0,e:"Reduced adjective clause: 'who is enrolled' menjadi 'enrolled'. Verba utamanya 'must submit'."},
 {s:14,q:"While _____ the mountain, the climbers encountered a sudden storm.",o:["climbing","they climbing","climbed","were climbing"],a:0,e:"Reduced adverb clause: 'While they were climbing' menjadi 'While climbing'."},
 {s:16,q:"Between the two hills _____ a narrow, winding river.",o:["flows","does flow","flowing","it flows"],a:0,e:"Keterangan tempat di awal kalimat diikuti inversi verba + subjek: flows a narrow, winding river."},
 {s:17,q:"Only after the experiment was repeated several times _____ the results.",o:["did the researchers accept","the researchers accepted","the researchers did accept","accepted the researchers"],a:0,e:"'Only after …' di awal kalimat menuntut inversi auxiliary + subjek: did the researchers accept."},
 {s:18,q:"_____ the patient arrived earlier, the doctors could have saved him.",o:["Had","If","Should","Were"],a:0,e:"Conditional tipe 3 tanpa 'if': Had the patient arrived (= If the patient had arrived). 'If the patient arrived' tidak cocok dengan 'could have saved'."},
 {s:18,q:"_____ you need further information, please contact the front desk.",o:["Should","Had","Were","Would"],a:0,e:"'Should you need' = If you need. Inversi dengan 'should' dipakai untuk kemungkinan di masa depan."},
 {s:19,q:"The northern route is shorter than _____ the southern one.",o:["is","does","has","was"],a:0,e:"Setelah 'than' boleh terjadi inversi dengan subjek noun: than is the southern one. Verba yang dipakai harus 'is', sesuai 'is shorter'."},
 {s:61,q:"The museum recently acquired _____.",o:["a beautiful old Chinese vase","a Chinese old beautiful vase","an old beautiful Chinese vase","a vase beautiful old Chinese"],a:0,e:"Urutan adjective: opini (beautiful), usia (old), asal (Chinese), lalu noun."},
 {s:61,q:"Only a few people know _____.",o:["how old the building is","how old is the building","the building how old is","how is old the building"],a:0,e:"Dalam noun clause, susunannya pernyataan: how old + subject + verb."},
 {s:61,q:"The water in the well was _____ to drink.",o:["too dirty","dirty too","enough dirty","so dirty"],a:0,e:"'Too + adjective + to infinitive' berarti terlalu … untuk. 'So dirty' memerlukan pola 'so … that'."},
 {s:61,q:"Penguins are birds _____ fly.",o:["that cannot","cannot that","that not can","not that can"],a:0,e:"Adjective clause: that + modal + not + verba dasar."},
 {s:62,q:"Many students enjoy _____ in study groups.",o:["working","to work","work","worked"],a:0,e:"'Enjoy' selalu diikuti gerund (-ing)."},
 {s:62,q:"The committee decided _____ the meeting until next week.",o:["to postpone","postponing","postpone","postponed"],a:0,e:"'Decide' diikuti to-infinitive."},
 {s:62,q:"_____ regularly can reduce the risk of heart disease.",o:["Exercising","Exercise it","To exercising","Exercised"],a:0,e:"Gerund dapat menjadi subjek kalimat: Exercising regularly …"},
 {s:62,q:"The purpose of the study was _____ how sleep affects memory.",o:["to determine","determined","it determined","for determining it"],a:0,e:"Setelah 'the purpose … was', to-infinitive menyatakan tujuan."},
 {s:63,q:"Walking into the laboratory, _____.",o:["the researcher noticed a strange smell","a strange smell was noticed by the researcher","a strange smell filled the room","the room had a strange smell"],a:0,e:"Pelaku 'walking' harus menjadi subjek klausa utama: the researcher. Kalau tidak, modifiernya dangling."},
 {s:63,q:"Born in a small village, _____.",o:["the writer often described rural life in her novels","rural life was often described in her novels","her novels often described rural life","the novels of the writer described rural life"],a:0,e:"Yang lahir di desa adalah penulisnya, jadi subjek klausa utama harus 'the writer'."},
 {s:63,q:"After finishing the experiment, _____.",o:["the students wrote their report","the report was written by the students","the report was finally written","writing the report began"],a:0,e:"Yang menyelesaikan eksperimen adalah para mahasiswa, jadi mereka harus menjadi subjek."},
 {s:63,q:"_____, the vaccine was distributed to clinics across the country.",o:["Approved by health authorities","Health authorities approved it","Approving by health authorities","Having approved"],a:0,e:"Vaksin disetujui (pasif), jadi modifiernya past participle. 'Having approved' berarti vaksin yang menyetujui."},
 {s:64,q:"The medicine can be taken _____ with food or without food.",o:["either","both","neither","whether or"],a:0,e:"Pasangan 'or' adalah 'either': either … or."},
 {s:64,q:"_____ the nurse nor the doctor was available at that hour.",o:["Neither","Either","Both","Not only"],a:0,e:"Pasangan 'nor' adalah 'neither'."},
 {s:64,q:"The program helps both students _____ their families.",o:["and","or","nor","but also"],a:0,e:"Pasangan 'both' adalah 'and'."},
 {s:64,q:"The new method is not only faster _____ cheaper.",o:["but also","and also","but too","as well"],a:0,e:"Pasangan 'not only' adalah 'but also'."},
 {s:65,q:"There is _____ evidence that the treatment works.",o:["no","not","none","never"],a:0,e:"'No' dipakai di depan noun (no evidence). 'Not' menegasikan verba atau adjective."},
 {s:65,q:"_____ of the samples showed signs of contamination.",o:["None","No","Not","Nothing"],a:0,e:"'None of the …' berarti tidak satu pun dari …"},
 {s:65,q:"The patient had _____ experienced such severe pain before.",o:["never","no","none","nothing"],a:0,e:"Adverb negatif 'never' diletakkan di antara had dan past participle."},
 {s:65,q:"It is _____ possible to see the comet without a telescope.",o:["not","no","none","nor"],a:0,e:"'Not' menegasikan adjective (possible)."},
 /* --- tambahan bank simulasi (soal 72–101) --- */
 {s:1,q:"Every spring, _____ to the beaches of eastern Indonesia to lay their eggs.",o:["sea turtles return","returning sea turtles","sea turtles returning","the return of sea turtles"],a:0,e:"Kalimat butuh subjek (sea turtles) dan verba utama (return). Bentuk -ing dan frasa benda tidak memberi verba utama."},
 {s:2,q:"Because of the high salt content of the water, _____ in the Dead Sea.",o:["swimmers float easily","floating easily swimmers","swimmers floating easily","the easy floating"],a:0,e:"'The high salt content of the water' adalah objek preposisi 'because of'. Klausa utama masih butuh subjek + verba: swimmers float."},
 {s:3,q:"Borobudur, _____, was built in the ninth century.",o:["the world's largest Buddhist temple","it is the world's largest Buddhist temple","is the world's largest Buddhist temple","which the world's largest Buddhist temple"],a:0,e:"Di antara dua koma dibutuhkan appositive (frasa benda). 'Which' memerlukan verba (which is …)."},
 {s:4,q:"The scientist _____ the experiment has already published her first results.",o:["conducting","conducts","is conducting","was conducted"],a:0,e:"Verba utama kalimat adalah 'has published'. Bagian kosong adalah reduced clause aktif (who is conducting → conducting)."},
 {s:5,q:"Medicine _____ for young children must be stored in a cool, dry place.",o:["prescribed","prescribes","is prescribed","was prescribing"],a:0,e:"Verba utamanya 'must be stored'. Obat diresepkan (pasif), jadi modifiernya past participle: prescribed."},
 {s:6,q:"The laboratory was closed for repairs, _____ the students did their experiments in the classroom.",o:["so","because of","despite","in spite"],a:0,e:"Dua klausa dihubungkan coordinate connector. Hubungannya sebab-akibat, jadi 'so'. 'Because of' dan 'despite' adalah preposisi yang harus diikuti noun."},
 {s:7,q:"_____ the bridge was repaired, traffic moved much more smoothly.",o:["After","During","Despite","Because of"],a:0,e:"Yang mengikuti adalah klausa lengkap (the bridge was repaired), jadi dibutuhkan adverb connector: after. 'During', 'despite', dan 'because of' adalah preposisi."},
 {s:8,q:"_____ the hike was long and difficult, everyone in the group reached the summit.",o:["Although","Despite","Because","In spite of"],a:0,e:"Makna kontras + klausa lengkap → although. 'Despite' dan 'in spite of' preposisi, sedangkan 'because' tidak logis."},
 {s:9,q:"Researchers still do not know exactly _____ some birds find their way across thousands of kilometers.",o:["how","what","which","that how"],a:0,e:"Klausa sesudahnya sudah lengkap (some birds find their way), jadi konektor noun clause yang cocok adalah 'how'. 'What' harus mengisi peran subjek atau objek."},
 {s:10,q:"_____ caused the power failure is still under investigation.",o:["What","That","It","Which it"],a:0,e:"Noun clause menjadi subjek kalimat dan konektornya sekaligus menjadi subjek verba 'caused': what."},
 {s:11,q:"The volcano _____ erupted in 2010 is located in Central Java.",o:["that","it","what","when it"],a:0,e:"Dibutuhkan adjective clause connector yang juga menjadi subjek 'erupted': that (atau which)."},
 {s:12,q:"Students _____ submit their assignments late will lose points.",o:["who","whom","which","whose"],a:0,e:"Konektor adjective clause untuk orang yang berfungsi sebagai subjek adalah 'who'. 'Whom' untuk objek."},
 {s:13,q:"The documents _____ in the old library were nearly two hundred years old.",o:["found","finding","were found","that found"],a:0,e:"Reduced adjective clause pasif: documents (which were) found. 'Were found' menambah verba kedua; 'that found' berarti dokumen yang menemukan."},
 {s:14,q:"_____ in a dry place, rice can be kept for many months.",o:["If stored","If storing","It is stored","Stores"],a:0,e:"Reduced adverb clause pasif: if (it is) stored. Beras disimpan, bukan menyimpan, jadi bukan 'if storing'."},
 {s:15,q:"The tour guide explained _____ built without modern machines.",o:["how the pyramids were","how were the pyramids","the pyramids how were","were the pyramids how"],a:0,e:"Question word di tengah kalimat membentuk noun clause, sehingga urutannya subjek + verba (tanpa inversi): how the pyramids were."},
 {s:16,q:"On the top of the hill _____.",o:["stands an old lighthouse","an old lighthouse standing","standing an old lighthouse","does an old lighthouse stand"],a:0,e:"Keterangan tempat di awal kalimat dapat diikuti inversi verba + subjek: stands an old lighthouse. Inversi dengan 'does' hanya dipakai setelah kata negatif atau pertanyaan."},
 {s:17,q:"Seldom _____ such a large crowd at a scientific lecture.",o:["have we seen","we have seen","we seen","have seen we"],a:0,e:"Kata negatif 'seldom' di awal kalimat diikuti inversi: auxiliary + subjek + verba (have we seen)."},
 {s:18,q:"_____ more time, the team would have finished the project.",o:["Had they had","They had had","If they have","Have they had"],a:0,e:"Conditional tipe 3 tanpa 'if' memakai inversi: Had they had = If they had had."},
 {s:19,q:"The new engine uses less fuel than _____ the old one.",o:["does","do","is","it does"],a:0,e:"Setelah 'than' dalam perbandingan boleh ada inversi: than does the old one. Subjeknya tunggal, jadi 'does'."},
 {s:61,q:"The museum owns _____ collection of ancient textiles in the region.",o:["the most complete","the completest most","most the complete","complete the most"],a:0,e:"Urutan yang benar: article + most + adjective + noun (the most complete collection)."},
 {s:61,q:"The visitor asked me where _____.",o:["the nearest pharmacy was","was the nearest pharmacy","is the nearest pharmacy","the nearest was pharmacy"],a:0,e:"Pertanyaan tidak langsung (indirect question) memakai urutan pernyataan: subjek + verba (the nearest pharmacy was)."},
 {s:62,q:"The committee decided _____ the meeting until next month.",o:["to postpone","postponing","postpone","to postponing"],a:0,e:"Verba 'decide' diikuti to-infinitive: decided to postpone."},
 {s:62,q:"Many patients avoid _____ to the dentist until the pain becomes serious.",o:["going","to go","go","to going"],a:0,e:"Verba 'avoid' diikuti gerund (-ing): avoid going."},
 {s:63,q:"_____, the old map revealed the location of a forgotten village.",o:["Carefully restored by experts","Restoring it carefully","Experts carefully restored it","Having carefully restored"],a:0,e:"Subjek kalimat adalah 'the old map'. Peta itu direstorasi (pasif), jadi modifiernya past participle."},
 {s:64,q:"The new vaccine has proved to be _____ safe and effective.",o:["both","either","neither","not only"],a:0,e:"Pasangan 'and' adalah 'both': both safe and effective."},
 {s:64,q:"Applicants may submit their forms _____ by mail or online.",o:["either","both","neither","not only"],a:0,e:"Pasangan 'or' adalah 'either': either by mail or online."},
 {s:65,q:"_____ student is allowed to leave the exam room during the first thirty minutes.",o:["No","Not","None","Nor"],a:0,e:"'No' dipakai langsung di depan noun (no student). 'None' harus diikuti 'of the …'."},
 {s:7,q:"_____ the soil is rich in minerals, farmers in the area grow excellent coffee.",o:["Because","Because of","Due to","Since of"],a:0,e:"Yang mengikuti adalah klausa lengkap, jadi konektornya 'because'. 'Because of' dan 'due to' harus diikuti noun."},
 {s:17,q:"Not until the late nineteenth century _____ widely used in homes.",o:["was electricity","electricity was","electricity","it was electricity"],a:0,e:"'Not until …' di awal kalimat menyebabkan inversi pada klausa utama: was electricity."},
 {s:12,q:"The researcher _____ book won the award will speak at the conference.",o:["whose","who","whom","which"],a:0,e:"Kepemilikan (buku milik peneliti) dalam adjective clause memakai 'whose' + noun."}

 {s:20,t:"The [[effects]] of the new medicine [[has]] not yet [[been]] fully [[studied]].",a:1,f:"have",e:"Subjeknya 'the effects' (jamak), bukan 'medicine'."},

 {id:"p1",title:"Coral Reefs",p:[
  "Coral reefs are among the most diverse ecosystems on Earth, yet they cover less than one percent of the ocean floor. Although a reef may look like a single rocky structure, it is in fact built by countless tiny animals called polyps. Each polyp, which is often no larger than a pencil eraser, extracts calcium and carbonate from seawater and uses these materials to construct a hard, cup-shaped skeleton around its soft body. When a polyp dies, its skeleton remains, and new polyps grow on top of it. Over thousands of years, these layers accumulate into the massive formations that divers admire today.",
  "The growth of a reef depends heavily on a partnership between the polyps and microscopic algae known as zooxanthellae, which live inside the polyps' tissues. Through photosynthesis, the algae produce sugars and oxygen that the coral uses for energy; in return, the coral provides the algae with shelter and with the carbon dioxide they need. The algae are also responsible for the brilliant colors of many reefs. Because the algae require sunlight, reef-building corals are generally restricted to shallow, clear water, usually less than 60 meters deep, where light can penetrate easily.",
  "This delicate relationship can break down when conditions change. If the water becomes even one or two degrees Celsius warmer than normal for several weeks, stressed polyps expel their algae. Without the algae, the coral tissue becomes transparent and the white skeleton shows through, a phenomenon called bleaching. Bleached corals are not dead, but they are starving, and if the stress continues, they may not survive. Scientists are concerned that rising ocean temperatures are making such events more frequent and more severe."],

 {id:"p2",title:"The Language of Honeybees",p:[
  "For centuries, beekeepers noticed that once a single honeybee discovered a rich source of nectar, many other bees from the same hive soon arrived at the same flowers. How the first bee communicated the location remained a mystery until the Austrian scientist Karl von Frisch began a series of careful experiments in the early twentieth century. By placing dishes of sugar water at various distances from a hive and marking the bees that visited them, von Frisch was able to observe how the returning foragers behaved inside the hive.",
  "He found that bees use two main types of dances. When food is close to the hive, a forager performs a round dance, moving in small circles first in one direction and then in the other. This dance tells the other bees that food is nearby but gives little information about its direction. When the food is farther away, the forager performs a waggle dance. In this dance, the bee runs in a straight line while vigorously shaking its abdomen, then circles back to repeat the run. The length of time the bee spends waggling indicates how far away the food is, while the angle of the straight run indicates its direction.",
  "Remarkably, the bees translate the position of the sun into a vertical reference. Because the dance takes place on the vertical surface of the honeycomb in the darkness of the hive, a run straight upward means that the food lies in the same direction as the sun. A run angled 40 degrees to the right of vertical means that the food is 40 degrees to the right of the sun. Von Frisch's discoveries were at first met with skepticism, but later studies confirmed them, and in 1973 he shared the Nobel Prize in Physiology or Medicine for his work on animal behavior."],

  {s:2,q:"How is the information in paragraph 2 organized?",o:["Two types of behavior are described and contrasted","A problem is presented and then solved","Events are listed in chronological order","An argument is made and then rejected"],a:0,e:"Paragraf 2 menjelaskan round dance lalu waggle dance dan membandingkan informasi yang disampaikan masing-masing."},

  {s:3,q:"According to paragraph 2, the round dance indicates that food is",o:["far from the hive","in the direction of the sun","near the hive","of poor quality"],a:2,e:"'This dance tells the other bees that food is nearby.'"},

 {id:"p3",title:"The Erie Canal",p:[
  "In the early 1800s, transporting goods between the Atlantic coast and the growing settlements west of the Appalachian Mountains was slow and expensive. Wagons pulled by horses could carry only small loads over rough roads, and moving a ton of grain a few hundred miles could cost more than the grain itself was worth. Many people believed that a canal connecting the Hudson River to the Great Lakes would solve this problem, but the project seemed impossibly ambitious. The proposed route would stretch roughly 363 miles through forests, swamps, and rocky ridges.",
  "The canal's strongest supporter was DeWitt Clinton, who became governor of New York in 1817. Critics mocked the plan as \"Clinton's Ditch,\" doubting that it could ever be completed. Nevertheless, construction began that same year. Because the United States had few trained engineers at the time, many of the men who directed the work learned their skills on the job. Thousands of laborers, many of them recent immigrants, dug the channel largely by hand, using shovels, picks, and horse-drawn equipment. To overcome a difference in elevation of nearly 600 feet, the builders constructed a series of locks, chambers in which boats could be raised or lowered by changing the water level.",
  "When the Erie Canal opened in 1825, it was an immediate success. The cost of shipping goods between Buffalo and New York City fell dramatically, and journeys that had once taken weeks could be completed in a fraction of the time. Farmers in the Midwest could now sell their crops in eastern markets, and manufactured goods flowed westward in return. New York City rapidly became the busiest port in the nation, and towns such as Syracuse, Rochester, and Buffalo grew along the canal's banks. The canal's success also inspired a wave of canal building in other states, although few of these later projects proved as profitable."],

 {id:"p4",title:"The Dust Bowl",p:[
  "During the 1930s, a series of severe dust storms swept across the southern Great Plains of the United States, an area that became known as the Dust Bowl. The region, which included parts of Oklahoma, Texas, Kansas, Colorado, and New Mexico, had once been covered with deep-rooted prairie grasses. These grasses held the soil in place and retained moisture even during periods of little rain.",
  "In the decades before the disaster, however, settlers plowed millions of acres of grassland to plant wheat. High wheat prices during and after World War I encouraged farmers to expand their fields, and new machinery such as gasoline-powered tractors made it possible to cultivate huge areas quickly. When a long drought struck in the early 1930s, the crops failed, and the exposed soil, no longer anchored by grass roots, dried out and was lifted by the strong winds that are common on the plains.",
  "The resulting storms were enormous. On April 14, 1935, a day later called Black Sunday, a wall of dust rolled across the plains, turning day into night. Dust from the region was carried as far as the Atlantic coast. Many families lost their farms, and hundreds of thousands of people left the region in search of work elsewhere. In response, the federal government established the Soil Conservation Service in 1935 to teach farmers techniques such as contour plowing, crop rotation, and the planting of long rows of trees, called shelterbelts, to break the force of the wind. These practices, together with the return of rain in the late 1930s, gradually brought the crisis to an end."],

  {s:1,q:"The passage mainly discusses",o:["the causes and effects of the Dust Bowl","the history of wheat farming in Europe","the invention of the tractor","weather patterns on the Atlantic coast"],a:0,e:"Paragraf 2 menjelaskan penyebab, paragraf 3 dampak dan penanganannya."},
  {s:3,q:"According to paragraph 1, the prairie grasses",o:["were planted by settlers","kept the soil from blowing away","needed a great deal of rain","were harmful to wheat crops"],a:1,e:"'These grasses held the soil in place.'"},
  {s:2,q:"How does the author organize the discussion in paragraphs 2 and 3?",o:["By describing causes and then consequences","By comparing two different regions","By presenting opposing opinions","By defining a series of terms"],a:0,e:"Paragraf 2 menjelaskan sebab (pembajakan dan kekeringan), lalu paragraf 3 menjelaskan akibat (badai, migrasi, kebijakan)."},

 {id:"p5",title:"Comets",p:[
  "For much of human history, comets were regarded as mysterious and often frightening visitors. Today astronomers understand that a comet is a small body of ice, dust, and rock that orbits the Sun. In 1950, the American astronomer Fred Whipple proposed that the solid core of a comet, called the nucleus, resembles a \"dirty snowball,\" a mixture of frozen water, frozen gases, and dust. Most nuclei are only a few kilometers across.",
  "A comet is barely visible while it travels in the cold outer regions of the solar system. As it approaches the Sun, however, solar heat causes some of the ice in the nucleus to turn directly into gas, releasing dust as well. This material forms a glowing cloud, or coma, around the nucleus, which can grow larger than a planet. Radiation and the solar wind, a stream of charged particles flowing outward from the Sun, push gas and dust away from the coma to form one or more tails. Consequently, a comet's tail always points away from the Sun, regardless of the direction in which the comet is moving.",
  "Comets are generally divided into two groups according to the time they take to complete one orbit. Short-period comets, which return in fewer than 200 years, are thought to come from the Kuiper Belt, a region of icy objects beyond Neptune. The best known of these is Halley's Comet, which appears about every 76 years. Long-period comets may take thousands or even millions of years to complete a single orbit and are believed to originate in the Oort Cloud, a vast, distant shell of icy bodies that surrounds the solar system. Because comets have changed little since the solar system formed, scientists study them for clues about its earliest history."],
  q:[
  {s:1,q:"What is the passage mainly about?",o:["The structure and behavior of comets","The life of Fred Whipple","Ancient beliefs about the night sky","How planets form from dust"],a:0,e:"Bacaan membahas susunan komet (nukleus, koma, ekor) dan pengelompokannya berdasarkan orbit."},
  {s:3,q:"According to Whipple, the nucleus of a comet is made mostly of",o:["hot gas","ice and dust","solid metal","liquid water"],a:1,e:"'Dirty snowball', yaitu campuran air beku, gas beku, dan debu."},
  {s:8,q:"In paragraph 2, the word \"coma\" refers to",o:["a cloud of gas and dust around the nucleus","the long tail of a comet","a region beyond Neptune","the center of the Sun"],a:0,e:"Polanya 'a glowing cloud, or coma': kata 'or' memperkenalkan sinonim atau definisi.",hl:[1,"coma"]},
  {s:10,q:"The word \"releasing\" in paragraph 2 is closest in meaning to",o:["letting out","catching","heating","hiding"],a:0,e:"Es berubah menjadi gas sambil melepaskan debu. Releasing berarti letting out.",hl:[1,"releasing"]},

  {s:5,q:"The word \"which\" in the phrase \"which can grow larger than a planet\" in paragraph 2 refers to",o:["the nucleus","the glowing cloud, or coma","the Sun","the dust"],a:1,e:"Yang bisa lebih besar dari planet adalah awan bercahaya (coma), bukan nukleus yang hanya beberapa kilometer.",hl:[1,"which can grow larger than a planet"]},

  {s:4,q:"Which of the following is NOT true of long-period comets?",o:["They may take millions of years to orbit the Sun","They are believed to come from the Oort Cloud","They return in fewer than 200 years","Their orbits take longer than those of short-period comets"],a:2,e:"Kembali dalam waktu kurang dari 200 tahun adalah ciri short-period comet."},
  {s:13,q:"The author mentions Halley's Comet as an example of",o:["a long-period comet","a short-period comet","a comet with no tail","a comet discovered by Whipple"],a:1,e:"'The best known of these', yaitu yang paling terkenal di antara short-period comets."},
  {s:12,q:"Where in the passage does the author explain why comets are valuable to scientists?",o:["At the end of paragraph 1","In the middle of paragraph 2","At the end of paragraph 3","At the beginning of paragraph 3"],a:2,e:"Kalimat terakhir paragraf 3: scientists study them for clues about its earliest history."}

 {id:"p6",title:"The Body's Internal Clock",p:[
  "Nearly all living things, from bacteria to human beings, show daily cycles of activity known as circadian rhythms. The term comes from the Latin words circa, meaning \"about,\" and dies, meaning \"day.\" In humans, these rhythms influence not only when we feel sleepy or alert but also body temperature, hormone levels, and digestion. Body temperature, for instance, typically reaches its lowest point in the early morning hours and rises during the day.",
  "These cycles are controlled by an internal clock located in a tiny region of the brain called the suprachiasmatic nucleus, or SCN, which lies in the hypothalamus. The SCN receives information about light directly from the eyes. When light levels fall in the evening, the SCN signals the pineal gland to release melatonin, a hormone that promotes sleep. In the morning, exposure to light reduces melatonin production, helping the body wake up.",
  "Experiments have shown that the internal clock keeps running even without clues from the environment. In 1962, the French explorer Michel Siffre spent about two months in an underground cave with no clocks and no daylight. He continued to sleep and wake in regular cycles, but his \"day\" gradually became slightly longer than 24 hours. Such findings demonstrate that light acts mainly to reset the clock each day rather than to create the rhythm itself. When the clock and the outside world fall out of step, as happens when travelers cross several time zones, people experience jet lag, which may include fatigue, poor concentration, and stomach problems until the clock adjusts."],
  q:[
  {s:1,q:"What is the main topic of the passage?",o:["The body's internal clock and how it works","The causes of insomnia","The history of cave exploration","Hormones that control digestion"],a:0,e:"Bacaan menjelaskan circadian rhythm, pusat kendalinya (SCN), dan bukti eksperimennya."},
  {s:9,q:"Based on its word parts, the word \"circadian\" originally meant",o:["about a day","around the brain","light and dark","a sleep cycle"],a:0,e:"Circa berarti 'about' dan dies berarti 'day'. Ini contoh menebak makna dari bagian kata.",hl:[0,"circadian"]},
  {s:3,q:"According to paragraph 1, body temperature is usually lowest",o:["at noon","in the early morning","in the evening","after meals"],a:1,e:"'… reaches its lowest point in the early morning hours.'"},
  {s:3,q:"According to the passage, the SCN is located in",o:["the eyes","the pineal gland","the hypothalamus","the stomach"],a:2,e:"'… the suprachiasmatic nucleus, or SCN, which lies in the hypothalamus.'"},
  {s:10,q:"The word \"promotes\" in paragraph 2 is closest in meaning to",o:["encourages","prevents","measures","delays"],a:0,e:"Melatonin adalah hormon yang mendorong tidur. Promotes berarti encourages.",hl:[1,"promotes"]},
  {s:6,q:"It can be inferred from paragraph 2 that people exposed to bright light late at night may",o:["fall asleep more quickly","produce less melatonin and have difficulty sleeping","have a higher body temperature the next morning","become immune to jet lag"],a:1,e:"Cahaya mengurangi produksi melatonin, sedangkan melatonin memicu tidur. Jadi cahaya terang di malam hari dapat mengganggu tidur."},
  {s:3,q:"What did Michel Siffre's experience in the cave show?",o:["People cannot sleep without daylight","The internal clock continues without environmental clues","Caves improve the quality of sleep","Melatonin is produced only underground"],a:1,e:"Kalimat pembuka paragraf 3 adalah kesimpulan yang didukung oleh pengalaman Siffre."},
  {s:5,q:"The word \"which\" in the phrase \"which may include fatigue\" in paragraph 3 refers to",o:["jet lag","time zones","the clock","travelers"],a:0,e:"Gejala kelelahan dan susah konsentrasi adalah bagian dari jet lag.",hl:[2,"which may include fatigue"]},
  {s:4,q:"Which of the following is NOT mentioned as a symptom of jet lag?",o:["Fatigue","Poor concentration","Stomach problems","Fever"],a:3,e:"Demam tidak disebut dalam bacaan."},
  {s:13,q:"The tone of the passage is best described as",o:["informative","humorous","critical","sorrowful"],a:0,e:"Bacaan menyampaikan fakta ilmiah secara netral."}
 ]},
 {id:"p7",title:"The Discovery of Vitamins",p:[
  "For much of the nineteenth century, physicians believed that diseases were caused either by germs or by poisons. The idea that an illness could result from the absence of something in the diet was slow to gain acceptance. One of the first clues came from the island of Java, where the Dutch physician Christiaan Eijkman was sent in the 1880s to study beriberi, a disease that weakened the nerves and heart and was common among soldiers and prisoners in the region.",
  "Eijkman at first assumed that beriberi was caused by bacteria, and he spent years searching for the responsible germ without success. The breakthrough came by accident. Chickens kept at his laboratory suddenly developed weakness and paralysis resembling beriberi. Eijkman discovered that during this period the birds had been fed polished white rice, the leftover food from a military hospital. When a new cook refused to give hospital rice to the chickens and returned to feeding them cheaper unpolished rice, the birds recovered. Eijkman concluded that the outer layer of the rice grain, which is removed during polishing, contained something that protected against the disease.",
  "Later researchers built on this observation. In 1912, the Polish biochemist Casimir Funk proposed that beriberi, scurvy, and several other illnesses were caused by a lack of particular substances in food. Because he believed these substances belonged to a class of chemicals called amines, he named them \"vital amines,\" or vitamines. When it was later found that not all of them were amines, the final e was dropped, giving us the modern word vitamin. In 1929, Eijkman shared the Nobel Prize in Physiology or Medicine for his contribution to the discovery."],
  q:[
  {s:1,q:"What does the passage mainly discuss?",o:["How the role of vitamins in preventing disease was discovered","The history of rice farming in Java","Why bacteria cause beriberi","The training of Dutch physicians"],a:0,e:"Bacaan menelusuri penemuan Eijkman hingga istilah 'vitamin' dari Funk."},
  {s:3,q:"According to paragraph 1, nineteenth-century physicians generally believed that diseases were caused by",o:["poor diets","germs or poisons","a lack of exercise","inherited weakness"],a:1,e:"'… diseases were caused either by germs or by poisons.'"},
  {s:3,q:"According to the passage, why was Eijkman sent to Java?",o:["To manage a military hospital","To study beriberi","To improve rice production","To teach chemistry"],a:1,e:"'… was sent in the 1880s to study beriberi.'"},
  {s:10,q:"The word \"resembling\" in paragraph 2 is closest in meaning to",o:["similar to","caused by","worse than","different from"],a:0,e:"Gejala pada ayam mirip beriberi. Resembling berarti similar to.",hl:[1,"resembling"]},
  {s:6,q:"It can be inferred from paragraph 2 that the chickens recovered because",o:["they were given medicine","they ate rice that still had its outer layer","the bacteria in the laboratory were destroyed","the new cook kept them warm"],a:1,e:"Ayam sembuh setelah kembali diberi beras tidak disosoh (unpolished), yang lapisan luarnya masih utuh."},
  {s:5,q:"The word \"which\" in the phrase \"which is removed during polishing\" in paragraph 2 refers to",o:["the rice grain","the outer layer","the disease","the cook"],a:1,e:"Yang dibuang saat penyosohan adalah lapisan luar (outer layer) butir beras.",hl:[1,"which is removed during polishing"]},
  {s:13,q:"Why does the author state that the breakthrough \"came by accident\"?",o:["To emphasize that Eijkman's key discovery was unplanned","To criticize Eijkman's research methods","To show that the chickens were poorly cared for","To suggest that Eijkman's results were unreliable"],a:0,e:"Penemuan itu terjadi karena pergantian pakan yang tidak direncanakan, bukan karena desain penelitian."},
  {s:9,q:"According to paragraph 3, the word \"vitamine\" was formed from",o:["the words \"vital\" and \"amine\"","the name of a Polish scientist","the Latin word for rice","the name of a disease"],a:0,e:"Funk menamainya 'vital amines', lalu disingkat menjadi vitamine. Ini contoh makna dari bagian kata.",hl:[2,"vitamines"]},
  {s:4,q:"Which of the following is NOT mentioned in the passage?",o:["Funk gave a name to the substances he described","Beriberi affected the nerves and heart","Eijkman received a Nobel Prize","Funk discovered a cure for scurvy"],a:3,e:"Funk hanya mengusulkan bahwa scurvy disebabkan kekurangan zat tertentu. Ia tidak disebut menemukan obatnya."},
  {s:2,q:"How is the information in the passage mainly organized?",o:["In chronological order","By comparing two diseases","By listing advantages and disadvantages","By classifying types of vitamins"],a:0,e:"Bacaan bergerak dari abad ke-19, ke tahun 1880-an, 1912, lalu 1929."}
 ]},
 {id:"p8",title:"Sea Otters and Kelp Forests",p:[
  "Along the Pacific coast of North America, forests of giant kelp, a type of large brown seaweed, rise from the sea floor toward the surface. These underwater forests provide food and shelter for hundreds of species of fish and invertebrates. Their survival, surprisingly, depends to a large degree on a small furry mammal: the sea otter.",
  "Sea otters feed on a variety of shellfish, but one of their favorite foods is the sea urchin, a spiny animal that grazes on kelp. Where otters are present, they keep the number of urchins in check, and the kelp forests flourish. Where otters are absent, urchin populations can grow rapidly and consume the kelp faster than it can regrow, leaving behind bare areas of rock sometimes called urchin barrens. Because the otter's influence on its ecosystem is far greater than its numbers would suggest, ecologists describe it as a keystone species, a term introduced by the biologist Robert Paine in 1969. The name refers to the central stone at the top of an arch, which holds the other stones in place.",
  "The importance of sea otters became clear partly through their near disappearance. Unlike whales and seals, otters lack a thick layer of fat and instead rely on extremely dense fur to stay warm in cold water. That same fur made them a prime target of hunters during the eighteenth and nineteenth centuries, and by the early 1900s only a few small populations remained. Since an international treaty banned commercial hunting in 1911, otters have returned to parts of their former range, and in many of those places the kelp forests have recovered as well."],
  q:[
  {s:1,q:"What is the passage mainly about?",o:["The relationship between sea otters and kelp forests","The life cycle of sea urchins","Methods used by fur hunters","The career of Robert Paine"],a:0,e:"Seluruh bacaan menjelaskan bagaimana berang-berang laut menjaga hutan kelp."},
  {s:8,q:"According to paragraph 1, kelp is",o:["a type of large brown seaweed","a small furry mammal","a spiny animal","an area of bare rock"],a:0,e:"Definisinya diberikan sebagai appositive: giant kelp, a type of large brown seaweed.",hl:[0,"giant kelp"]},
  {s:3,q:"According to paragraph 2, sea urchins",o:["feed on kelp","hunt sea otters","protect kelp forests","live only in deep water"],a:0,e:"'… the sea urchin, a spiny animal that grazes on kelp.'"},
  {s:10,q:"The word \"flourish\" in paragraph 2 is closest in meaning to",o:["grow well","disappear","move away","become dangerous"],a:0,e:"Saat jumlah bulu babi terkendali, hutan kelp tumbuh subur.",hl:[1,"flourish"]},
  {s:6,q:"It can be inferred that urchin barrens are most likely to be found where",o:["sea otters are numerous","sea otters are few or absent","kelp grows fastest","fishing is prohibited"],a:1,e:"Paragraf 2: tanpa berang-berang, bulu babi menghabiskan kelp dan meninggalkan batu gundul."},
  {s:13,q:"Why does the author mention the central stone at the top of an arch?",o:["To explain the meaning of the term \"keystone species\"","To describe the shape of kelp forests","To compare otters to builders","To show where otters build their homes"],a:0,e:"Batu kunci menahan batu-batu lain, sama seperti spesies kunci menopang ekosistemnya."},
  {s:3,q:"According to paragraph 3, how do sea otters stay warm?",o:["With a thick layer of fat","With very dense fur","By staying in shallow water","By resting on kelp"],a:1,e:"'… rely on extremely dense fur to stay warm.' Lapisan lemak tebal justru dimiliki paus dan anjing laut."},
  {s:11,q:"The word \"prime\" in paragraph 3 is closest in meaning to",o:["main","earliest","costly","youngest"],a:0,e:"'A prime target' berarti sasaran utama.",hl:[2,"prime"]},
  {s:5,q:"The word \"those\" in the phrase \"in many of those places\" in paragraph 3 refers to",o:["parts of the otters' former range","hunters","small populations","whales and seals"],a:0,e:"Tempat-tempat yang dimaksud adalah bagian wilayah jelajah lama yang kini dihuni kembali oleh berang-berang.",hl:[2,"in many of those places"]},
  {s:7,q:"The paragraph following the passage most likely discusses",o:["other species that play a keystone role in their ecosystems","the price of otter fur today","how to grow kelp in aquariums","the students of Robert Paine"],a:0,e:"Bacaan memperkenalkan konsep keystone species, jadi lanjutan yang logis adalah contoh spesies kunci lainnya."}
 ]},
 {id:"p9",title:"The Transcontinental Railroad",p:[
  "Before 1869, a traveler going from the eastern United States to California faced a long and dangerous choice. The overland journey by wagon could take four to six months, while the sea voyage around the southern tip of South America was nearly as slow. A railroad across the continent had been discussed for years, but disagreements over its route delayed action until 1862, when Congress passed the Pacific Railway Act.",
  "The law assigned the work to two companies. The Central Pacific Railroad would build eastward from Sacramento, California, while the Union Pacific Railroad would build westward from the Missouri River near Omaha, Nebraska. To encourage rapid progress, the government gave each company land and loans for every mile of track it completed, which turned the project into a race. The Central Pacific faced the harder task at first, because its crews had to cut through the granite of the Sierra Nevada mountains, often in deep snow. Short of workers, the company hired thousands of laborers from China, who eventually made up the majority of its workforce. The Union Pacific, which crossed the flatter Great Plains, relied heavily on Irish immigrants and Civil War veterans.",
  "On May 10, 1869, the two lines met at Promontory Summit in the Utah Territory, where a ceremonial golden spike was driven to join the rails. News of the event was sent across the country by telegraph almost instantly. The railroad cut the journey from coast to coast to about a week and dramatically lowered the cost of travel and shipping. It also accelerated the settlement of the West, with serious consequences for Native American peoples, whose lands and ways of life were disrupted by the growing number of settlers and the destruction of the buffalo herds."],
  q:[
  {s:1,q:"Which of the following would be the best title for the passage?",o:["The Building of the First Transcontinental Railroad","Travel by Sea in the 1800s","The Life of Chinese Immigrants","The History of the Telegraph"],a:0,e:"Bacaan membahas latar belakang, pembangunan, dan dampak jalur kereta lintas benua."},
  {s:3,q:"According to paragraph 1, what delayed the building of the railroad?",o:["A lack of money","Disagreements about the route","The Civil War","Opposition from shipping companies"],a:1,e:"'… disagreements over its route delayed action until 1862.'"},
  {s:3,q:"According to the passage, where did the Central Pacific begin construction?",o:["Omaha","Sacramento","Promontory Summit","The Great Plains"],a:1,e:"'The Central Pacific Railroad would build eastward from Sacramento.'"},
  {s:6,q:"It can be inferred that the project \"turned into a race\" because",o:["each company gained more by laying more track","the workers were paid by the hour","the government set a strict deadline","both companies wanted to reach California first"],a:0,e:"Pemerintah memberi tanah dan pinjaman per mil rel, jadi semakin cepat membangun, semakin besar keuntungan."},
  {s:10,q:"The word \"granite\" in paragraph 2 most likely refers to",o:["a type of hard rock","a kind of tree","a mountain river","a construction tool"],a:0,e:"Kru harus 'cut through the granite' pegunungan. Dari konteksnya, granite adalah batuan keras.",hl:[1,"granite"]},
  {s:3,q:"According to the passage, most of the Central Pacific's workers eventually came from",o:["Ireland","China","the Great Plains","the Union army"],a:1,e:"Buruh dari Tiongkok 'eventually made up the majority of its workforce.' Imigran Irlandia bekerja di Union Pacific."},
  {s:5,q:"The word \"whose\" in paragraph 3 refers to",o:["settlers","Native American peoples","the buffalo herds","the railroad"],a:1,e:"'Native American peoples, whose lands and ways of life …'",hl:[2,"whose lands"]},
  {s:10,q:"The word \"accelerated\" in paragraph 3 is closest in meaning to",o:["sped up","prevented","recorded","described"],a:0,e:"Rel kereta mempercepat pemukiman di wilayah Barat.",hl:[2,"accelerated"]},
  {s:4,q:"All of the following are mentioned as effects of the railroad EXCEPT",o:["shorter travel time","lower shipping costs","faster settlement of the West","the founding of new universities"],a:3,e:"Pendirian universitas tidak disebut dalam bacaan."},
  {s:13,q:"The author's attitude toward the effects of the railroad can best be described as",o:["balanced, noting both benefits and harms","entirely enthusiastic","strongly opposed","uninterested"],a:0,e:"Penulis menyebut manfaat (waktu dan biaya) sekaligus dampak buruk bagi penduduk asli Amerika."}
 ]},
 {id:"p10",title:"The Origin of the Hawaiian Islands",p:[
  "The Hawaiian Islands lie in the middle of the Pacific Ocean, more than 3,000 kilometers from the nearest continent and far from the edges of any tectonic plate. Most of the world's volcanoes form along plate boundaries, where one plate sinks beneath another or where plates pull apart. The location of Hawaii's volcanoes therefore puzzled geologists for many years.",
  "In 1963, the Canadian geophysicist J. Tuzo Wilson offered an explanation. He suggested that a hot spot, a fixed area of unusually hot material rising from deep within the Earth, lies beneath the Pacific Plate. As magma from the hot spot pushes up through the crust, it builds a volcano on the sea floor that may eventually rise above the water to form an island. Meanwhile, the Pacific Plate moves slowly northwest, at a rate of several centimeters per year, carrying the volcano away from the hot spot. Cut off from its supply of magma, the volcano becomes inactive, and a new volcano begins to form over the hot spot.",
  "Wilson's theory accounts for a striking pattern in the island chain. The islands grow progressively older toward the northwest. Kauai, at the northwestern end of the main islands, is roughly five million years old, and its volcanoes have long been silent. The island of Hawaii, often called the Big Island, at the southeastern end, is less than one million years old and contains Kilauea, one of the most active volcanoes on Earth. Older islands farther northwest have been worn down by erosion and have sunk beneath the waves, and southeast of the Big Island, an undersea volcano is already growing that may one day become the newest Hawaiian island."],
  q:[
  {s:1,q:"What is the main topic of the passage?",o:["How the Hawaiian Islands were formed","The tourism industry in Hawaii","The life of J. Tuzo Wilson","Why volcanoes are dangerous"],a:0,e:"Bacaan menjelaskan teori hot spot dan pola umur pulau-pulau Hawaii."},
  {s:3,q:"According to paragraph 1, why did the location of Hawaii's volcanoes puzzle geologists?",o:["They are far from plate boundaries, where most volcanoes form","They erupt more often than other volcanoes","They are located near a continent","They are older than the ocean floor"],a:0,e:"Kebanyakan gunung api terbentuk di batas lempeng, sedangkan Hawaii jauh dari batas lempeng mana pun."},
  {s:8,q:"According to paragraph 2, a \"hot spot\" is",o:["a fixed area of hot material rising from deep in the Earth","an active volcano on an island","the edge of a tectonic plate","a warm ocean current"],a:0,e:"Definisinya diberikan sebagai appositive langsung setelah istilahnya.",hl:[1,"hot spot"]},
  {s:5,q:"The word \"it\" in the phrase \"it builds a volcano\" in paragraph 2 refers to",o:["magma","the crust","the Pacific Plate","the hot spot"],a:0,e:"'As magma … pushes up through the crust, it builds a volcano'. Yang membangun gunung api adalah magma.",hl:[1,"it builds a volcano"]},
  {s:3,q:"According to paragraph 2, a volcano becomes inactive when",o:["it rises above sea level","the plate carries it away from the hot spot","the hot spot moves northwest","it reaches five million years of age"],a:1,e:"Gunung api yang terbawa menjauh dari hot spot kehilangan pasokan magma."},
  {s:10,q:"The word \"striking\" in paragraph 3 is closest in meaning to",o:["noticeable","violent","recent","confusing"],a:0,e:"'A striking pattern' adalah pola yang mencolok atau mudah terlihat.",hl:[2,"striking"]},
  {s:6,q:"It can be inferred from the passage that an island located northwest of Kauai would most likely be",o:["younger than Kauai","older than Kauai","more active than the Big Island","located over the hot spot"],a:1,e:"Pulau-pulau semakin tua ke arah barat laut, jadi pulau di barat laut Kauai lebih tua."},
  {s:4,q:"Which of the following is NOT true of the Big Island?",o:["It is less than one million years old","It contains Kilauea","It lies at the southeastern end of the main islands","It is the oldest of the main islands"],a:3,e:"Big Island justru yang termuda. Pulau tertua di antara pulau utama adalah Kauai."},
  {s:12,q:"Where in the passage does the author mention a volcano that has not yet reached the surface of the ocean?",o:["Paragraph 1","The beginning of paragraph 2","The end of paragraph 3","The beginning of paragraph 3"],a:2,e:"Kalimat terakhir paragraf 3 menyebut an undersea volcano is already growing."},
  {s:11,q:"The phrase \"accounts for\" in paragraph 3 is closest in meaning to",o:["explains","counts","pays for","ignores"],a:0,e:"'Wilson's theory accounts for a striking pattern' berarti teori itu menjelaskan pola tersebut.",hl:[2,"accounts for"]}
 ]},
