 {id:"p11",title:"Monarch Butterfly Migration",p:[
  "Each autumn, millions of monarch butterflies in eastern North America begin one of the most remarkable journeys in the animal world. Flying as far as 4,000 kilometers, they travel from Canada and the northern United States to a small area of mountain forests in central Mexico. There they gather in such dense clusters on the branches of fir trees that the branches sometimes bend under their weight. The butterflies remain in these forests through the winter, surviving on stored fat and conserving energy in the cool mountain air.",
  "What makes this migration so puzzling is that no individual butterfly ever completes the entire round trip. Monarchs born in early summer live only two to six weeks, just long enough to mate and lay eggs. The generation that emerges in late summer, however, is different. These butterflies delay reproduction and can live as long as eight months, which allows them to fly south, spend the winter in Mexico, and begin the return journey in spring. Their offspring and the generations that follow continue the trip northward. Thus, the butterflies that arrive in Mexico each autumn have never been there before.",
  "How do they find their way? Researchers have shown that monarchs use the position of the sun as a compass. Because the sun moves across the sky during the day, the butterflies must also rely on an internal clock, located in their antennae, to correct for the time of day. Some evidence suggests that they can also sense the Earth's magnetic field, which may help on cloudy days. Unfortunately, the migration is now threatened. The loss of milkweed, the only plant on which monarch caterpillars can feed, and the clearing of the Mexican forests have caused the number of migrating butterflies to fall sharply in recent decades."],
  q:[
  {s:1,q:"What does the passage mainly discuss?",o:["The migration of monarch butterflies and how they accomplish it","The life cycle of insects that live in Mexico","Methods of protecting fir forests","The diet of monarch caterpillars"],a:0,e:"Paragraf 1 menggambarkan perjalanan, paragraf 2 generasi yang melakukannya, paragraf 3 cara navigasi dan ancamannya."},
  {s:3,q:"According to paragraph 1, where do the monarchs spend the winter?",o:["In mountain forests in central Mexico","In the northern United States","Along the coast of Canada","In warm lowland valleys"],a:0,e:"'… to a small area of mountain forests in central Mexico … remain in these forests through the winter.'"},
  {s:10,q:"The word \"dense\" in paragraph 1 is closest in meaning to",o:["closely packed","brightly colored","silent","temporary"],a:0,e:"Kerumunannya begitu rapat sampai dahan melengkung. Dense berarti padat/rapat.",hl:[0,"dense"]},
  {s:6,q:"It can be inferred from paragraph 2 that the butterflies that fly to Mexico in autumn",o:["were born in late summer","were born in early summer","have made the trip before","live for only a few weeks"],a:0,e:"Hanya generasi akhir musim panas yang berumur panjang dan sanggup terbang ke selatan."},
  {s:5,q:"The word \"Their\" in the phrase \"Their offspring\" in paragraph 2 refers to",o:["the butterflies that begin the return journey","the butterflies born in early summer","the forests in Mexico","the eggs"],a:0,e:"Keturunan dari kupu-kupu berumur panjang yang memulai perjalanan pulang di musim semi.",hl:[1,"Their offspring"]},
  {s:3,q:"According to paragraph 3, why do monarchs need an internal clock?",o:["To adjust for the sun's changing position during the day","To know when winter begins","To decide when to lay eggs","To sense the Earth's magnetic field"],a:0,e:"Matahari bergerak sepanjang hari, jadi jam internal dipakai untuk mengoreksi arah sesuai waktu."},
  {s:4,q:"Which of the following is NOT mentioned as something monarchs may use to find their way?",o:["Landmarks such as rivers and mountains","The position of the sun","An internal clock","The Earth's magnetic field"],a:0,e:"Matahari, jam internal, dan medan magnet disebut di paragraf 3. Penanda alam seperti sungai tidak disebut."},
  {s:11,q:"The word \"sharply\" in paragraph 3 is closest in meaning to",o:["dramatically","painfully","slowly","clearly"],a:0,e:"'Fall sharply' berarti turun drastis.",hl:[2,"sharply"]},
  {s:8,q:"According to the passage, milkweed is",o:["the only food of monarch caterpillars","a tree in the Mexican forests","a chemical that guides the butterflies","a plant that adult butterflies avoid"],a:0,e:"Definisinya diberikan dalam appositive: 'the only plant on which monarch caterpillars can feed'.",hl:[2,"milkweed"]},
  {s:13,q:"Why does the author mention that the butterflies arriving in Mexico \"have never been there before\"?",o:["To emphasize that the route is not learned from experience","To show that the forests are new","To suggest that the butterflies are often lost","To explain why so many butterflies die"],a:0,e:"Kupu-kupu itu belum pernah ke Meksiko, jadi rutenya bukan hasil pengalaman. Ini mengantar ke pertanyaan 'How do they find their way?'"}
 ]},
 {id:"p12",title:"The Invention of Paper",p:[
  "Before the invention of paper, people wrote on a wide variety of materials. The ancient Egyptians used papyrus, made from strips of a reed that grew along the Nile. In China, early records were written on strips of bamboo or on silk. Bamboo was cheap but heavy and bulky; a single book might require a cart to transport it. Silk was light and easy to write on, but it was far too expensive for everyday use.",
  "According to Chinese historical records, a court official named Cai Lun presented a new writing material to the emperor in the year 105. He had made it by soaking tree bark, hemp, old rags, and fishing nets in water, beating the mixture into a pulp, and spreading the pulp thinly over a screen to dry. Archaeologists have since found fragments of paper that appear to be older than Cai Lun's time, so he was probably not the first person to make paper. Nevertheless, he is credited with improving the process and making paper practical to produce in large quantities.",
  "For several centuries, the Chinese kept the technique largely to themselves. Papermaking spread to Korea and Japan by the seventh century, and according to a well-known account, Chinese papermakers captured in a battle in 751 taught the craft in the city of Samarkand in Central Asia. From there, the knowledge traveled to Baghdad, Cairo, and eventually Spain, where Europe's first paper mills were established in the twelfth century. Once paper became widely available, books could be produced far more cheaply, a development that would later help make the printing press so influential."],
  q:[
  {s:1,q:"What is the main topic of the passage?",o:["The origin and spread of paper","The life of Cai Lun","Writing materials of ancient Egypt","The invention of the printing press"],a:0,e:"Bacaan membahas bahan tulis sebelum kertas, penemuan kertas, lalu penyebarannya."},
  {s:3,q:"According to paragraph 1, what was a disadvantage of bamboo as a writing material?",o:["It was heavy and took up a lot of space","It was very expensive","It could not hold ink","It grew only along the Nile"],a:0,e:"'Bamboo was cheap but heavy and bulky.' Mahal adalah kelemahan sutra."},
  {s:10,q:"The word \"bulky\" in paragraph 1 is closest in meaning to",o:["taking up much space","easily broken","hard to find","costly"],a:0,e:"Satu buku sampai butuh gerobak, jadi bulky berarti besar dan memakan tempat.",hl:[0,"bulky"]},

 {id:"p13",title:"Tsunamis",p:[
  "A tsunami is a series of ocean waves caused by the sudden movement of a large volume of water. Most tsunamis are triggered by earthquakes beneath the sea floor, when one section of the Earth's crust suddenly rises or drops and pushes the water above it. Landslides, volcanic eruptions, and, very rarely, meteorite impacts can also produce them. Tsunamis are sometimes called tidal waves, but the term is misleading, since they have nothing to do with the tides, which are caused by the gravitational pull of the moon and the sun.",
  "In the open ocean, a tsunami is surprisingly hard to notice. Its waves may be less than a meter high, yet they can stretch more than a hundred kilometers from one crest to the next and travel as fast as a jet airplane, at about 700 kilometers per hour. A ship at sea might pass over one without its crew feeling anything unusual. As the waves approach the shore and the water becomes shallower, however, they slow down and their energy is squeezed into a smaller space. As a result, the waves grow much taller, sometimes reaching heights of more than 30 meters.",
  "Often the first sign of an approaching tsunami is not a wave at all. Instead, the sea suddenly withdraws, exposing the sea floor, harbors, and stranded fish. Curious people who walk out to look are in great danger, because the water usually returns within minutes. After the disastrous Indian Ocean tsunami of 2004, which killed more than 200,000 people in fourteen countries, governments expanded their warning systems. Today, pressure sensors on the deep ocean floor detect passing tsunamis and send signals to buoys at the surface, which relay the information by satellite to warning centers."],
  q:[
  {s:1,q:"What does the passage mainly discuss?",o:["The causes, behavior, and warning signs of tsunamis","The history of the 2004 Indian Ocean tsunami","How tides are produced by the moon","The design of ships for the open ocean"],a:0,e:"Paragraf 1 penyebab, paragraf 2 perilaku gelombang, paragraf 3 tanda bahaya dan sistem peringatan."},
  {s:3,q:"According to paragraph 1, most tsunamis are caused by",o:["earthquakes under the sea floor","meteorite impacts","the pull of the moon","strong winds over the ocean"],a:0,e:"'Most tsunamis are triggered by earthquakes beneath the sea floor.'"},
  {s:10,q:"The word \"misleading\" in paragraph 1 is closest in meaning to",o:["likely to give a false impression","difficult to pronounce","scientifically precise","old-fashioned"],a:0,e:"Istilah tidal wave memberi kesan keliru bahwa tsunami berkaitan dengan pasang surut.",hl:[0,"misleading"]},
  {s:3,q:"Why does the author say the term \"tidal waves\" is not accurate?",o:["Tsunamis are not related to the tides","Tsunamis occur only at high tide","Tides are caused by earthquakes","Tidal waves are smaller than tsunamis"],a:0,e:"'… they have nothing to do with the tides.'"},
  {s:5,q:"The word \"one\" in the phrase \"pass over one\" in paragraph 2 refers to",o:["a tsunami","a ship","a crest","a jet airplane"],a:0,e:"Kapal bisa melintasi gelombang tsunami tanpa awaknya merasakan apa pun.",hl:[1,"pass over one"]},
  {s:3,q:"According to paragraph 2, what happens as a tsunami reaches shallow water?",o:["It slows down and becomes much taller","It speeds up and becomes smaller","It changes direction and moves back to sea","It loses most of its energy"],a:0,e:"'They slow down and their energy is squeezed … the waves grow much taller.'"},
  {s:6,q:"It can be inferred from paragraph 2 that a tsunami in the open ocean",o:["is usually not dangerous to ships","moves more slowly than ordinary waves","is easy to see from an airplane","is always taller than 30 meters"],a:0,e:"Kapal dapat melintasinya tanpa merasakan apa pun, jadi di laut lepas tsunami jarang membahayakan kapal."},
  {s:4,q:"Which of the following is NOT mentioned as a possible cause of a tsunami?",o:["Strong winds","Landslides","Volcanic eruptions","Meteorite impacts"],a:0,e:"Longsor, letusan gunung api, dan tumbukan meteorit semuanya disebut. Angin kencang tidak disebut."},
  {s:11,q:"The word \"relay\" in paragraph 3 is closest in meaning to",o:["pass on","delay","measure","store"],a:0,e:"Pelampung meneruskan informasi lewat satelit ke pusat peringatan.",hl:[2,"relay"]},
  {s:12,q:"Where in the passage does the author describe a natural sign that a tsunami is coming?",o:["The beginning of paragraph 3","The beginning of paragraph 1","The end of paragraph 2","The end of paragraph 3"],a:0,e:"Awal paragraf 3: laut tiba-tiba surut sebelum gelombang datang."}

 {id:"p14",title:"The Komodo Dragon",p:[
  "The Komodo dragon is the largest living lizard in the world. Adults can grow to about three meters in length and weigh 70 kilograms or more. The species is found only on a handful of islands in eastern Indonesia, including Komodo, Rinca, and parts of Flores. Western scientists did not describe the animal until 1912, after Dutch officials heard reports of a giant \"land crocodile\" living on the islands. Today much of its range is protected within Komodo National Park, which was established in 1980.",
  "Komodo dragons are powerful predators that eat almost any kind of meat, from small rodents to deer and water buffalo. Rather than chasing their prey over long distances, they usually wait in hiding beside a trail and attack suddenly. For many years, scientists believed that dangerous bacteria in the dragon's mouth killed prey that escaped after being bitten. More recent studies, however, have found that the dragons have glands in their lower jaw that release venom. The venom prevents blood from clotting and lowers blood pressure, so a bitten animal quickly grows weak. The dragon then follows it, sometimes for kilometers, using its forked tongue to detect the scent in the air.",
  "In 2006, keepers at two zoos in England made a surprising discovery. Female Komodo dragons that had been kept apart from males laid eggs that hatched successfully. This form of reproduction, known as parthenogenesis, had been recorded in some other reptiles but never before in this species. Scientists suggest that the ability may help the species survive, because a single female that reaches a new island could, in theory, start a new population. Even so, the dragon remains vulnerable. With only a few thousand individuals left in the wild, it is threatened by habitat loss, by a shrinking supply of prey, and by rising sea levels."],
  q:[
  {s:1,q:"What is the passage mainly about?",o:["The characteristics and survival of the Komodo dragon","The history of Komodo National Park","Reptiles kept in English zoos","The islands of eastern Indonesia"],a:0,e:"Bacaan membahas ukuran dan habitat, cara berburu, reproduksi, serta ancaman bagi komodo."},
  {s:3,q:"According to paragraph 1, where are Komodo dragons found?",o:["Only on a few islands in eastern Indonesia","Throughout Southeast Asia","In the forests of western Indonesia","On islands near the Netherlands"],a:0,e:"'The species is found only on a handful of islands in eastern Indonesia.'"},
  {s:10,q:"The word \"handful\" in paragraph 1 is closest in meaning to",o:["small number","large group","chain","variety"],a:0,e:"'A handful of islands' berarti beberapa pulau saja.",hl:[0,"handful"]},
  {s:6,q:"It can be inferred from paragraph 1 that before 1912",o:["local people already knew about the dragon","no one had ever seen a Komodo dragon","the dragon lived in Europe","Komodo National Park was already established"],a:0,e:"Laporan tentang 'land crocodile' sampai ke pejabat Belanda, artinya penduduk setempat sudah mengenalnya."},
  {s:3,q:"According to paragraph 2, how do Komodo dragons usually hunt?",o:["By waiting in hiding and attacking suddenly","By chasing prey over long distances","By hunting in large groups","By attacking only at night"],a:0,e:"'… they usually wait in hiding beside a trail and attack suddenly.'"},
  {s:5,q:"The word \"it\" in the phrase \"The dragon then follows it\" in paragraph 2 refers to",o:["the bitten animal","the venom","the trail","the forked tongue"],a:0,e:"Komodo mengikuti hewan yang sudah digigit dan melemah.",hl:[1,"follows it"]},
  {s:13,q:"Why does the author mention the bacteria in the dragon's mouth?",o:["To describe an earlier belief that has since been revised","To explain how the venom is produced","To warn visitors about the danger of bites","To compare dragons with crocodiles"],a:0,e:"Kata 'For many years, scientists believed … however, more recent studies …' menunjukkan keyakinan lama yang telah direvisi."},
  {s:8,q:"In paragraph 3, the term \"parthenogenesis\" refers to",o:["reproduction by a female without a male","the hatching of eggs in a zoo","the movement of dragons to new islands","a disease that affects reptiles"],a:0,e:"Kalimat sebelumnya menjelaskan betina yang dipisahkan dari jantan tetap menghasilkan telur yang menetas.",hl:[2,"parthenogenesis"]},
  {s:4,q:"Which of the following is NOT mentioned as a threat to Komodo dragons?",o:["Competition with crocodiles","Habitat loss","A shrinking supply of prey","Rising sea levels"],a:0,e:"Hilangnya habitat, berkurangnya mangsa, dan naiknya permukaan laut disebut. Persaingan dengan buaya tidak disebut."},
  {s:11,q:"The word \"vulnerable\" in paragraph 3 is closest in meaning to",o:["at risk","aggressive","common","protected"],a:0,e:"Kalimat berikutnya menyebut berbagai ancaman, jadi vulnerable berarti rentan atau terancam.",hl:[2,"vulnerable"]}
 ]},
 {id:"p15",title:"Antibiotic Resistance",p:[
  "When penicillin came into wide use in the 1940s, it seemed that the battle against bacterial infection had been won. Illnesses that had once been fatal, such as pneumonia and infected wounds, could suddenly be cured within days. Yet only a few years later, doctors began to notice that some bacteria were no longer affected by the drug. Today, antibiotic resistance is considered one of the most serious threats to public health worldwide.",
  "Resistance is a clear example of natural selection. In any large population of bacteria, a few cells may carry a random genetic change that allows them to survive an antibiotic. When the drug is used, it kills the susceptible bacteria, but the resistant ones survive and multiply, so that the next generation is dominated by them. Because bacteria can divide as often as every twenty minutes, this process can happen remarkably fast. Bacteria can also pass resistance genes directly to one another, even between different species, which allows resistance to spread far more quickly than it would through reproduction alone.",
  "Human behavior has accelerated the problem. Antibiotics are often prescribed for colds and flu, which are caused by viruses and cannot be treated with these drugs. Patients sometimes stop taking their medicine as soon as they feel better, leaving the toughest bacteria alive. In many countries, large amounts of antibiotics are also given to farm animals to make them grow faster. Health experts therefore urge doctors to prescribe antibiotics only when necessary and patients to follow instructions carefully. At the same time, researchers are searching for new drugs, a task made more urgent by the fact that few entirely new classes of antibiotics have been discovered in recent decades."],
  q:[
  {s:1,q:"What is the main idea of the passage?",o:["How antibiotic resistance develops and why it has become a serious problem","How penicillin was discovered","Why bacteria divide so quickly","The use of antibiotics on farms"],a:0,e:"Paragraf 1 memperkenalkan masalahnya, paragraf 2 mekanismenya, dan paragraf 3 peran perilaku manusia."},
  {s:3,q:"According to paragraph 1, what happened when penicillin came into wide use?",o:["Many once-deadly infections could be cured quickly","Bacteria immediately became resistant","Pneumonia disappeared completely","Doctors stopped using other medicines"],a:0,e:"'Illnesses that had once been fatal … could suddenly be cured within days.'"},
  {s:10,q:"The word \"susceptible\" in paragraph 2 is closest in meaning to",o:["easily harmed","strong","rare","newly formed"],a:0,e:"Bakteri susceptible adalah yang mati oleh obat, kebalikan dari yang resisten.",hl:[1,"susceptible"]},
  {s:5,q:"The word \"them\" in the phrase \"dominated by them\" in paragraph 2 refers to",o:["the resistant bacteria","the susceptible bacteria","the antibiotics","the genetic changes"],a:0,e:"Bakteri resisten bertahan dan berkembang biak sehingga mendominasi generasi berikutnya.",hl:[1,"dominated by them"]},
  {s:6,q:"It can be inferred from paragraph 2 that resistance would spread more slowly if bacteria",o:["could not pass genes to one another","divided more often","lived in larger populations","were exposed to more antibiotics"],a:0,e:"Pertukaran gen membuat resistensi menyebar jauh lebih cepat daripada lewat reproduksi saja."},
  {s:3,q:"According to paragraph 3, why are antibiotics not useful against colds and flu?",o:["These illnesses are caused by viruses","These illnesses are too mild to treat","The drugs work too slowly","Patients stop taking the drugs too early"],a:0,e:"'… colds and flu, which are caused by viruses and cannot be treated with these drugs.'"},
  {s:4,q:"Which of the following is NOT mentioned as a human behavior that worsens resistance?",o:["Using antibiotics to clean hospital equipment","Prescribing antibiotics for viral illnesses","Stopping medicine as soon as one feels better","Giving antibiotics to farm animals"],a:0,e:"Tiga perilaku lainnya disebut di paragraf 3. Membersihkan alat rumah sakit dengan antibiotik tidak disebut."},
  {s:11,q:"The word \"accelerated\" in paragraph 3 is closest in meaning to",o:["speeded up","prevented","explained","discovered"],a:0,e:"Perilaku manusia mempercepat masalah resistensi.",hl:[2,"accelerated"]},
  {s:9,q:"The prefix \"anti-\" in the word \"antibiotic\" suggests that these drugs",o:["act against living organisms such as bacteria","come before life begins","help living cells grow","are made from plants"],a:0,e:"Anti- berarti melawan, bio berarti hidup. Antibiotik bekerja melawan organisme hidup (bakteri)."},
  {s:13,q:"The author's tone in the passage can best be described as",o:["serious and informative","humorous","angry","uncertain and confused"],a:0,e:"Penulis menjelaskan fakta dan menekankan bahwa masalahnya serius, tanpa nada lucu atau marah."}
 ]}
];

 {id:"c2",title:"Library Orientation",intro:"Listen to a talk given to new students during orientation.",voice:"M",talk:"Welcome to orientation. I'm going to explain how to use the university library. First, your student card is also your library card, so please keep it with you. You can borrow up to ten books at a time for three weeks. If you need a book longer, you can renew it online, as long as no one else has requested it. Late books cost one thousand rupiah per day, so watch those due dates. The library also offers free workshops on how to search academic databases. These are held every Tuesday afternoon in room two oh four, and I strongly recommend them, especially if you'll be writing research papers this year. Finally, please remember that food is not allowed anywhere in the library, although covered drinks are fine.",
  q:[
  {s:9,q:"What is the main purpose of the talk?",o:["To explain library services to new students.","To announce a new library building.","To describe a research paper.","To sell student cards."],a:0,e:"'I'm going to explain how to use the university library.'"},
  {s:10,q:"How many books can a student borrow at one time?",o:["Ten.","Three.","Twenty.","Four."],a:0,e:"'Up to ten books at a time for three weeks.' Angka tiga adalah lama peminjaman (minggu)."},
  {s:10,q:"When can a book NOT be renewed?",o:["When another person has requested it.","When it is borrowed on a Tuesday.","When the student has no internet.","When it is a workshop book."],a:0,e:"'As long as no one else has requested it.'"},
  {s:10,q:"What is allowed in the library?",o:["Covered drinks.","Food.","Late books without fines.","Borrowing without a card."],a:0,e:"'Food is not allowed … although covered drinks are fine.'"}
 ]},
 {id:"c3",title:"How Cacti Survive",intro:"Listen to part of a lecture in a botany class.",voice:"M",talk:"Plants that live in deserts face a serious problem: how to survive with very little water. Cacti have developed several remarkable solutions. First, most cacti have no ordinary leaves. Instead, they have spines, which lose far less water than broad leaves do and also protect the plant from thirsty animals. Second, the thick stem of a cactus stores water. After a heavy rain, a large cactus can absorb hundreds of liters and then slowly use that supply during the dry months. Third, cacti have shallow but widespread roots, which allow them to collect rainwater quickly before it evaporates. Finally, many cacti open the tiny pores on their surface only at night, when the air is cooler, so less water escapes. Together, these features allow cacti to thrive where most plants would die.",
  q:[
  {s:9,q:"What is the lecture mainly about?",o:["How cacti survive in dry environments.","How to grow cacti at home.","Animals that live in deserts.","Why deserts receive little rain."],a:0,e:"Dosen menjelaskan empat cara kaktus bertahan dengan sedikit air."},
  {s:10,q:"According to the speaker, what do spines do?",o:["Reduce water loss and protect the plant.","Store water and make food.","Attract insects and absorb water.","Collect rain and cool the stem."],a:0,e:"Duri kehilangan lebih sedikit air dan melindungi tanaman dari hewan."},
  {s:10,q:"Why are cactus roots shallow and widespread?",o:["To collect rainwater quickly.","To store water for months.","To reach deep underground water.","To hold the plant against strong wind."],a:0,e:"'… collect rainwater quickly before it evaporates.'"},
  {s:10,q:"When do many cacti open their pores?",o:["At night.","At noon.","Right after it rains.","Only in summer."],a:0,e:"'… open the tiny pores … only at night, when the air is cooler.'"}
 ]},
 {id:"c4",title:"The Invention of the Stethoscope",intro:"Listen to part of a talk in a history of medicine class.",voice:"W",talk:"The stethoscope is perhaps the most familiar symbol of the medical profession, but it was invented almost by accident. In 1816, a French doctor named René Laennec was examining a young woman with heart trouble. At that time, doctors listened to the heart by placing an ear directly on the patient's chest, but Laennec felt this was inappropriate. He remembered seeing children send sounds to each other through a long piece of wood, so he rolled a sheet of paper into a tube, placed one end on the patient's chest, and listened at the other. To his surprise, he could hear the heartbeat more clearly than ever before. Laennec soon replaced the paper with a wooden tube. The version with two earpieces that doctors use today did not appear until the 1850s.",
  q:[
  {s:9,q:"What is the talk mainly about?",o:["The invention of the stethoscope.","Heart disease in the 1800s.","Children's games in France.","The training of French doctors."],a:0,e:"Seluruh talk menceritakan asal-usul stetoskop."},
  {s:10,q:"Why didn't Laennec want to place his ear on the patient's chest?",o:["He felt it was inappropriate.","The room was too noisy.","The patient refused.","He had poor hearing."],a:0,e:"'Laennec felt this was inappropriate.'"},
  {s:10,q:"What gave Laennec the idea for his invention?",o:["Children sending sounds through wood.","A book about sound.","A musical instrument.","Advice from another doctor."],a:0,e:"Ia teringat anak-anak yang mengirim bunyi lewat sebatang kayu."},
  {s:4,q:"What can be inferred about Laennec's first stethoscope?",o:["It had only one earpiece.","It was made of metal.","It was used before 1800.","It had two earpieces."],a:0,e:"Tabung kertas didengarkan dari satu ujung, dan versi dua earpiece baru muncul tahun 1850-an."}
 ]},

 {id:"c5",title:"Sleep and Memory",intro:"Listen to part of a lecture in a psychology class.",voice:"W",talk:"Many students believe that the best way to prepare for an exam is to stay up all night studying. Research suggests that this is a serious mistake. Sleep plays an essential role in forming long-term memories. During the day, new information is stored only temporarily in a part of the brain called the hippocampus. While we sleep, especially during the deep stages of sleep, the brain replays this information and transfers it to the outer layer of the brain, where it can be kept for much longer. In one well-known type of experiment, students learn a list of words in the evening. Those who sleep normally remember significantly more words the next morning than those who are kept awake. Sleep also seems to help us find hidden patterns and solve problems. So, the next time you have an exam, study a little each day and make sure you get a full night's sleep before the test.",
  q:[
  {s:9,q:"What is the main topic of the lecture?",o:["The role of sleep in forming memories.","The causes of sleeping problems.","How the hippocampus was discovered.","Ways to stay awake while studying."],a:0,e:"Dosen menjelaskan bahwa tidur penting untuk membentuk memori jangka panjang."},
  {s:10,q:"According to the speaker, what happens to new information during sleep?",o:["It is moved to another part of the brain for long-term storage.","It is erased from the brain.","It stays in the hippocampus permanently.","It is replaced by dreams."],a:0,e:"Otak memutar ulang informasi dan memindahkannya ke lapisan luar otak agar tersimpan lebih lama."},
  {s:10,q:"What did students who slept normally do in the experiments?",o:["They remembered more words.","They forgot most of the words.","They learned the words faster.","They made more mistakes."],a:0,e:"'Those who sleep normally remember significantly more words the next morning.'"},
  {s:10,q:"What does the speaker recommend?",o:["Studying a little each day and sleeping well before an exam.","Studying all night before an exam.","Taking short naps during class.","Memorizing lists of words."],a:0,e:"'Study a little each day and make sure you get a full night's sleep before the test.'"}
 ]},
 {id:"c6",title:"Campus Health Center",intro:"Listen to an announcement about the campus health center.",voice:"M",talk:"Good morning, everyone. I'd like to tell you about some changes at the campus health center that begin next month. First, the center will now be open on Saturdays from eight until noon, in addition to the regular weekday hours. Second, students will be able to book appointments online through the student portal instead of calling by phone. If you have an emergency, however, please come directly to the center, and you will be seen without an appointment. Third, the center will offer free flu vaccinations during the first two weeks of the month. Vaccinations are available to all students and staff, but you must bring your university identity card. Finally, a counselor will be available every afternoon for students who would like to talk about stress or other personal concerns. All conversations with the counselor are completely confidential.",
  q:[
  {s:9,q:"What is the main purpose of the announcement?",o:["To describe changes in health center services.","To introduce a new doctor.","To explain how to treat the flu.","To announce that the center is closing."],a:0,e:"'I'd like to tell you about some changes at the campus health center.'"},
  {s:10,q:"How will students make appointments in the future?",o:["Online through the student portal.","By telephone.","In person only.","Through their professors."],a:0,e:"'Book appointments online through the student portal instead of calling by phone.'"},
  {s:10,q:"What must people bring to get a flu vaccination?",o:["Their university identity card.","A doctor's letter.","A small fee.","Their vaccination record."],a:0,e:"'You must bring your university identity card.'"},
  {s:10,q:"What does the speaker say about the counselor?",o:["Conversations will be kept private.","The counselor is available only on Saturdays.","Students must pay for counseling.","Appointments must be made a week ahead."],a:0,e:"'All conversations with the counselor are completely confidential.'"}
 ]},
 {id:"c7",title:"The Art of Batik",intro:"Listen to part of a talk in an art history class.",voice:"W",talk:"Today we'll look at batik, a method of decorating cloth that is closely associated with Indonesia, especially the island of Java. Batik is a wax-resist technique. The artist applies hot wax to the parts of the cloth that should stay the original color. The cloth is then dyed, and because the dye cannot pass through the wax, those areas remain uncolored. The wax is later removed, often by boiling, and the process can be repeated many times to create complex designs with several colors. Traditionally, wax was applied by hand with a small tool called a canting, which has a copper cup and a thin spout. A single piece of hand-drawn batik could take weeks or even months to complete. In the nineteenth century, artisans began using copper stamps to apply wax, which made production much faster. In 2009, UNESCO recognized Indonesian batik as part of the world's intangible cultural heritage, and the second of October is now celebrated as National Batik Day.",
  q:[
  {s:9,q:"What is the talk mainly about?",o:["How batik is made and its history.","The history of the island of Java.","Different kinds of natural dyes.","How UNESCO chooses heritage sites."],a:0,e:"Pembicara menjelaskan teknik batik, alatnya, dan perkembangannya."},
  {s:10,q:"What is the purpose of the wax in batik?",o:["To keep dye from reaching parts of the cloth.","To make the cloth stronger.","To make the colors brighter.","To help the cloth dry faster."],a:0,e:"Pewarna tidak dapat menembus lilin, jadi bagian yang dilapisi lilin tetap berwarna asli."},
  {s:10,q:"What is a canting?",o:["A hand tool used to apply wax.","A type of dye.","A copper stamp.","A pattern used in Java."],a:0,e:"'A small tool called a canting, which has a copper cup and a thin spout.'"},
  {s:4,q:"What can be inferred about batik made with copper stamps?",o:["It takes less time to produce than hand-drawn batik.","It is more valuable than hand-drawn batik.","It was invented in 2009.","It does not use wax."],a:0,e:"Cap tembaga membuat produksi jauh lebih cepat dibanding batik tulis yang bisa makan waktu berminggu-minggu."}
 ]}

/* Acak posisi kunci jawaban secara tetap (seeded) untuk soal yang ditulis dengan kunci di A */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function permuteOpts(b){
  let x=hash(b.id)||1; const r=()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296};
  const idx=[0,1,2,3]; for(let i=3;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  b.o=idx.map(i=>b.o[i]); b.a=idx.indexOf(b.a);
}
BANK.forEach(b=>{ if(b.type!=="we" && !/pilihan/i.test(b.e)) permuteOpts(b); });

/* =========================================================
   TEXT-TO-SPEECH (Web Speech API bawaan browser)
   ========================================================= */
const TTS = {ok: typeof window.speechSynthesis!=="undefined", en:[], v:{}, same:false, on:false, key:null};
function pickVoices(){
  if(!TTS.ok) return;
  TTS.en = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const fem=/female|zira|aria|jenny|samantha|susan|hazel|libby|sonia|karen|moira|tessa|fiona|victoria|allison|ava|emma|michelle|natasha|clara|catherine|google us english$/i;
  const mal=/\bmale|david|mark|guy|george|ryan|daniel|alex\b|fred|tom\b|christopher|eric|brian|james|andrew|roger|steffan|william|google uk english male/i;
  const score=(v,re)=>(re.test(v.name)?4:0)+(/natural|online|neural/i.test(v.name)?2:0)+(/en[-_]us/i.test(v.lang)?1:0);
  const best=(re,ex=[])=>TTS.en.filter(v=>!ex.includes(v)).sort((a,b)=>score(b,re)-score(a,re))[0];
  const W=best(fem), M=best(mal,[W])||W, N=best(/./,[W,M])||M;
  TTS.v={W,M,N}; TTS.same = !!(W && M && W===M);
}
if(TTS.ok){ pickVoices(); speechSynthesis.onvoiceschanged=()=>{ pickVoices(); if(ui.screen==="home") render(); }; }
const hasVoice = () => TTS.ok && TTS.en.length>0;
function sentences(t){ return t.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g).map(s=>s.trim()).filter(Boolean); }
function stopSpeech(){ TTS.on=false; TTS.key=null; if(TTS.ok) speechSynthesis.cancel(); }
function speak(segs,key,onEnd){
  if(!hasVoice()) return;
  stopSpeech(); TTS.on=true; TTS.key=key;
  const queue=[]; segs.forEach(sg=>{const ss=sentences(sg.text); ss.forEach((t,i)=>queue.push({who:sg.who,text:t,gap:i===ss.length-1}))});
  let i=0;
  const next=()=>{
    if(!TTS.on||TTS.key!==key) return;
    if(i>=queue.length){ TTS.on=false; TTS.key=null; if(onEnd) onEnd(); render(); return; }
    const sg=queue[i++], u=new SpeechSynthesisUtterance(sg.text);
    u.lang="en-US"; const v=TTS.v[sg.who]; if(v) u.voice=v;
    u.rate=store.rate||0.95; u.pitch = TTS.same ? (sg.who==="M"?0.8:sg.who==="W"?1.25:1) : 1;
    u.onend=()=>setTimeout(next, sg.gap?500:80); u.onerror=()=>setTimeout(next,80);
    speechSynthesis.speak(u);
  };
  setTimeout(next,60); render();
}
/* Segmen audio untuk satu soal Listening. kind: "item" (dialog A / pertanyaan saja) atau "group" (percakapan/talk + pertanyaan) */
function segsFor(b,kind){
  const N=t=>({who:"N",text:t});
  if(b.part==="A") return [...b.d.map(([w,t])=>({who:w,text:t})), N(b.q)];
  const g=LSG[b.gid];
  if(kind==="group") return [N(g.intro), ...(g.d? g.d.map(([w,t])=>({who:w,text:t})) : [{who:g.voice,text:g.talk}]), N(b.q)];
  return [N(b.q)];
}
function audioKey(b,kind){ return kind==="group"? b.gid : b.id; }
function simKind(b){ return b.part!=="A" && (b.qi===0 || !T.played[b.gid]) ? "group" : "item"; }
function playFor(b,kind){
  const key=audioKey(b,kind);
  if(T.mode==="sim"){ if(T.played[key]) return; T.played[key]=true; }
  speak(segsFor(b,kind), key);
}

   FLASH CARD — sistem kotak Leitner sederhana
   kotak 0 = baru, 1 = belum hafal, 2–3 = sedang dipelajari, 4–5 = hafal
   ========================================================= */
const box = id => (store.cards||{})[id]||0;
function setBox(id,b){ store.cards=store.cards||{}; store.cards[id]=Math.max(1,Math.min(5,b)); save(store); }
function deckCards(deck){ return CARDS.filter(c=>deck==="all"||c.deck===deck); }
function deckStats(deck){
  const s={baru:0,belum:0,proses:0,hafal:0,total:0};
  deckCards(deck).forEach(c=>{const b=box(c.id); s.total++; if(b===0)s.baru++; else if(b===1)s.belum++; else if(b<4)s.proses++; else s.hafal++;});
  return s;
}
function startCards(deck){
  const fc = ui.fc = Object.assign({deck:"v",only:false,dir:"en"}, ui.fc||{}, deck?{deck}:{});
  let pool = deckCards(fc.deck); if(fc.only) pool = pool.filter(c=>box(c.id)<4);
  // kartu dengan kotak terendah muncul lebih dulu, diacak di dalam kotak yang sama
  pool = shuffle(pool).sort((a,b)=>box(a.id)-box(b.id));
  Object.assign(fc,{queue:pool.slice(0,20).map(c=>c.id), i:0, flip:false, tally:{1:0,2:0,3:0}});
  stopSpeech(); ui.screen="cards"; render(); window.scrollTo(0,0);
}
function rateCard(r){
  const fc=ui.fc, id=fc.queue[fc.i]; if(!id||!fc.flip) return;
  const b=box(id);
  if(r===1){ setBox(id,1); fc.queue.splice(Math.min(fc.i+4,fc.queue.length),0,id); }
  else if(r===2){ setBox(id,Math.max(2,b)); fc.queue.splice(Math.min(fc.i+8,fc.queue.length),0,id); }
  else setBox(id, b===0?3:b+1);
  fc.tally[r]++; fc.i++; fc.flip=false; stopSpeech(); render();
}
function sayCard(text){ if(hasVoice()) speak([{who:"N",text}],"card"); }
/* Pengecoh kuis tidak boleh bermakna mirip dengan jawaban benar */
const SYN_GROUPS=[["huge","very large","large"],["obvious","clear"],["sufficient","enough"],["necessary","vital","essential","important"],
  ["main","mainly"],["show"],["thrive","grow well"],["lessen","decrease"],["support","keep"],["get","achieve"],["change","differ"],
  ["postpone","accept an invitation for a later time","decide later","move to a later time","consider carefully"],["many","plentiful","more than enough"],["exact","precise"],["fast","speed up","very quickly"],
  ["get","gain","achieve"],["lessen","decrease","relieve","reduce"],["thorough","detailed"],["well-known","famous"],["new","new and original","innovative"],
  ["agree","I completely agree","share the same understanding","agree to"],["have a good relationship with","like each other immediately"],
  ["in trouble","in a risky situation"],["don't give up","stay positive in a difficult time"],["understand; solve","understand the situation","discover"],
  ["visit briefly"],["very rarely","never"],["main","best"],["remove","reduce"],["stop trying","refuse"]];
const STOP=new Set(["something","someone","very","with","from","that","have","your","than"]);
function nearSyn(a,b){
  if(a===b) return true;
  if(SYN_GROUPS.some(g=>g.includes(a)&&g.includes(b))) return true;
  const w=s=>s.toLowerCase().split(/[^a-z']+/).filter(x=>x.length>3&&!STOP.has(x));
  const A=new Set(w(a)); return w(b).some(x=>A.has(x));
}
function cardQuiz(){
  const fc=ui.fc; const deck=fc.deck;
  let pool=deckCards(deck); if(fc.only) pool=pool.filter(c=>box(c.id)<4); if(pool.length<4) pool=deckCards(deck);
  const pick=shuffle(pool).sort((a,b)=>box(a.id)-box(b.id)).slice(0,10);
  const stamp=Date.now().toString(36);
  const items=pick.map((c,i)=>{
    const others=shuffle(deckCards(c.deck).filter(x=>x.id!==c.id && !nearSyn(x.syn,c.syn))).slice(0,3).map(x=>x.syn);
    const o=shuffle([c.syn,...others]);
    const b={id:"vq"+stamp+i,type:"vc",s:c.deck==="v"?1:2,card:c.id,
      q: c.deck==="v" ? `The word "${c.w}" is closest in meaning to` : `What does "${c.w}" mean?`,
      o, a:o.indexOf(c.syn), e:`"${c.w}" berarti ${c.arti}. Contoh: ${c.ex}`};
    byId[b.id]=b; return b.id;
  });
  startTest({title: deck==="i"?"Kuis Idiom":deck==="v"?"Kuis Kosakata":"Kuis Kosakata & Idiom",sub:items.length+" soal · hasil memperbarui kotak flash card",items,feedback:true,mode:"practice"});
}

function transcriptHTML(b){
  const line=(w,t)=>`<p><b>${w==="M"?"Man":w==="W"?"Woman":"Narrator"}:</b> ${esc(t)}</p>`;
  let body;
  if(b.part==="A") body=b.d.map(([w,t])=>line(w,t)).join("");
  else { const g=LSG[b.gid]; body=`<p class="muted"><i>${esc(g.intro)}</i></p>`+(g.d? g.d.map(([w,t])=>line(w,t)).join("") : `<p>${esc(g.talk)}</p>`); }
  return `<details class="script"><summary>Naskah audio</summary>${body}<p class="muted"><b>Question:</b> ${esc(b.q)}</p></details>`;
}

function startTest(cfg){
  T = {title:cfg.title, sub:cfg.sub, items:cfg.items, mode:cfg.mode, feedback:cfg.feedback, sec:cfg.sec||0,
       ans:{}, flag:{}, played:{}, showScript:{}, idx:0, endsAt: cfg.minutes? Date.now()+cfg.minutes*60000 : null, confirm:false, started:Date.now()};
  ui.screen="test";
  clearInterval(tick);
  if(T.endsAt) tick=setInterval(()=>{const el=document.getElementById("timer"); if(!el) return; const left=T.endsAt-Date.now(); if(left<=0){finish();return} el.textContent=fmt(left); el.classList.toggle("low",left<120000)},500);
  render(); window.scrollTo(0,0);
}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

function practice(){
  const tab=ui.tab; let pool;
  if(tab==="ls"){
    const parts = ui.picked.size? ui.picked : new Set(["A","B","C"]);
    let items=[];
    if(parts.has("A")){ const a=shuffle(BANK.filter(b=>b.part==="A")); items.push(...a.slice(0, ui.count==="all"?a.length:ui.count).map(b=>b.id)); }
    ["B","C"].forEach(P=>{ if(parts.has(P)) shuffle(P==="B"?LS_B:LS_C).forEach(g=>g.q.forEach((_,i)=>items.push(g.id+"q"+(i+1)))); });
    return startTest({title:"Latihan Listening",sub:"Part "+[...parts].sort().join(", ")+" · "+items.length+" soal · umpan balik langsung",items,feedback:true,mode:"practice"});
  }
  if(tab==="rd"){
    const pids = ui.picked.size? [...ui.picked] : RD.map(p=>p.id);
    const items=[]; shuffle(pids).forEach(pid=>passage(pid).q.forEach((_,i)=>items.push(pid+"q"+(i+1))));
    return startTest({title:"Latihan Reading",sub:pids.length+" bacaan · umpan balik langsung",items,feedback:true,mode:"practice"});
  }
  const types = tab==="gr"?["st","we"]:[tab];
  pool = BANK.filter(b=>types.includes(b.type) && (ui.picked.size===0 || ui.picked.has(b.s)));

function pickFresh(list,n){ const seen=store.seen||{}; return shuffle(shuffle(list).sort((x,y)=>(seen[x.id]||0)-(seen[y.id]||0)).slice(0,n)); }
function markSeen(ids){ store.seen=store.seen||{}; new Set(ids.map(id=>byId[id].gid||byId[id].pid||id)).forEach(k=>store.seen[k]=(store.seen[k]||0)+1); }
function sim1(){
  const a=pickFresh(BANK.filter(b=>b.part==="A"),30).map(b=>b.id);
  const items=[...a];
  pickFresh(LS_B,2).forEach(g=>g.q.forEach((_,i)=>items.push(g.id+"q"+(i+1))));
  pickFresh(LS_C,3).forEach(g=>g.q.forEach((_,i)=>items.push(g.id+"q"+(i+1))));
  startTest({title:"Simulasi Section 1",sub:"Listening Comprehension · 50 soal · audio diputar sekali",items,minutes:35,feedback:false,mode:"sim",sec:1});
}
function sim2(){

  startTest({title:"Simulasi Section 2",sub:"Structure & Written Expression · 40 soal",items:[...st,...we],minutes:25,feedback:false,mode:"sim",sec:2});
}
function sim3(){

  ps.forEach(p=>p.q.forEach((_,i)=>items.push(p.id+"q"+(i+1))));
  startTest({title:"Simulasi Section 3",sub:"Reading Comprehension · 5 bacaan · 50 soal",items,minutes:55,feedback:false,mode:"sim",sec:3});

function mistakes(){
  const ids=Object.keys(store.wrong).filter(id=>byId[id]);
  if(!ids.length) return;
  const items=shuffle(ids);
  const grp=id=>{const b=byId[id]; return (b.gid||b.pid||"")+"|"+String(b.qi??"").padStart(2,"0")};
  items.sort((a,b)=>{const pa=grp(a), pb=grp(b); return pa<pb?-1:pa>pb?1:0});
  startTest({title:"Ulangi Soal yang Salah",sub:items.length+" soal dari catatan kesalahan",items,feedback:true,mode:"mistakes"});
}

function choose(i){
  const id=T.items[T.idx];
  if(T.feedback && T.ans[id]!==undefined) return;
  T.ans[id]=i;
  const b=byId[id];
  if(b.type==="vc"){ const cb=box(b.card); setBox(b.card, i===b.a ? (cb===0?3:cb+1) : 1); }
  else if(T.feedback){ if(i===b.a){ delete store.wrong[id]; } else { store.wrong[id]=1; } save(store); }
  render();
}
function go(n){ if(n<0||n>=T.items.length) return; stopSpeech(); T.idx=n; T.confirm=false; render(); }

function finish(){
  clearInterval(tick); stopSpeech();
  const res = T.items.map(id=>({id,ans:T.ans[id],ok:T.ans[id]===byId[id].a}));
  if(!T.feedback){ res.forEach(r=>{ if(byId[r.id].type==="vc") return; if(r.ok) delete store.wrong[r.id]; else store.wrong[r.id]=1; }); }
  const raw=res.filter(r=>r.ok).length, total=res.length;
  const entry={d:new Date().toISOString(),title:T.title,mode:T.mode,sec:T.sec,raw,total};
  if(T.mode==="sim"){ entry.scaled=scale(T.sec,raw,total); markSeen(T.items); }
  store.history.unshift(entry); store.history=store.history.slice(0,40); save(store);
  T.result={res,raw,total,scaled:entry.scaled}; T.filter="all";
  ui.screen="result"; render(); window.scrollTo(0,0);
}

}

    const back = `<div class="fc-pos">${esc(c.pos)}</div><div class="fc-word sm">${esc(c.w)}</div><div class="fc-arti">${esc(c.arti)}</div>
      <div class="fc-syn"><span class="eyebrow">${c.deck==="v"?"Sinonim":"Makna"}</span> ${esc(c.syn)}</div>
      <p class="fc-ex">${esc(c.ex)}</p><div class="row" style="justify-content:center"><button class="btn say" data-act="say" data-v="w" ${hasVoice()?"":"disabled"}>▶ Ucapkan</button><button class="btn say" data-act="say" data-v="ex" ${hasVoice()?"":"disabled"}>▶ Contoh kalimat</button></div>`;
    main = `<div class="fc ${fc.flip?"flipped":""}" data-act="flip" role="button" tabindex="0" aria-label="Balik kartu">
        <div class="fc-inner"><div class="fc-face front" aria-hidden="${fc.flip}">${front}</div><div class="fc-face back" aria-hidden="${!fc.flip}">${back}</div></div></div>
      <p class="fc-hint" style="text-align:center;margin-top:10px">Status: <b>${status}</b> · kartu ${fc.i+1} dari ${fc.queue.length}</p>
      <div class="fc-actions">${fc.flip
        ? `<button class="btn r1" data-act="rate" data-v="1">1 · Belum hafal</button><button class="btn r2" data-act="rate" data-v="2">2 · Ragu</button><button class="btn r3" data-act="rate" data-v="3">3 · Hafal</button>`
        : `<button class="btn primary" data-act="flip">Balik kartu</button>`}</div>
      <p class="fc-hint" style="text-align:center;margin-top:8px">Keyboard: Spasi untuk membalik, 1/2/3 untuk menilai.</p>`;
  }
  const pct = fc.queue.length? Math.round(100*Math.min(fc.i,fc.queue.length)/fc.queue.length) : 100;
  return `<div class="bar"><div class="inner">
      <button class="btn ghost" data-act="home" title="Kembali ke beranda">←</button>
      <div class="title">Flash Card<small>${deckName} · ${s.hafal} hafal</small></div>
      <button class="btn" data-act="fc-quiz">Kuis 10 soal</button>
    </div><div class="progress"><i style="width:${pct}%"></i></div></div>
    <div class="wrap" style="padding-top:16px">
      <div class="row" style="justify-content:space-between">
        <div class="tabs" role="group" aria-label="Pilih dek">${[["v","Kosakata"],["i","Idiom & phrasal verb"],["all","Semua"]].map(([k,v])=>`<button class="tab" data-act="fc-deck" data-v="${k}" aria-pressed="${fc.deck===k}">${v}</button>`).join("")}</div>
        <div class="tabs"><button class="tab" data-act="fc-only" aria-pressed="${fc.only}">Hanya yang belum hafal</button><button class="tab" data-act="fc-dir" aria-pressed="${fc.dir==="id"}">${fc.dir==="en"?"Inggris → Indonesia":"Indonesia → Inggris"}</button></div>
      </div>
      <div style="max-width:560px;margin:16px auto 0">${stackBar(s)}<p class="fc-hint" style="margin-top:6px"><span class="lg k-hafal"></span>Hafal ${s.hafal} <span class="lg k-proses"></span>Dipelajari ${s.proses} <span class="lg k-belum"></span>Belum hafal ${s.belum}</p></div>
      ${main}
    </div>`;
}

function weHTML(b, reveal){
  let k=-1;
  return esc(b.t).replace(/\[\[(.+?)\]\]/g,(m,x)=>{k++; const cls = reveal? (k===b.a?" isbad":"") : ""; return `<span class="ul${cls}"><u>${x}</u><sub>${L[k]}</sub></span>`});
}
function weParts(b){ return [...b.t.matchAll(/\[\[(.+?)\]\]/g)].map(m=>m[1]); }
function passageHTML(p, hl){
  return `<h3>${esc(p.title)}</h3>`+p.p.map((t,i)=>{
    let h=esc(t);
    if(hl && hl[0]===i){ const n=esc(hl[1]); const at=h.indexOf(n); if(at>=0) h=h.slice(0,at)+`<mark class="hl">${n}</mark>`+h.slice(at+n.length); }
    return `<p><span class="pn">¶${i+1}</span><span>${h}</span></p>`;
  }).join("");
}
function questionBody(b, chosen, reveal){
  let qt, opts;
  if(b.type==="st"){ qt = esc(b.q).replace("_____",'<span class="blank"></span>'); opts=b.o; }
  else if(b.type==="we"){ qt = weHTML(b, reveal); opts=weParts(b); }
  else if(b.type==="ls"){
    const hideQ = T && T.mode==="sim" && !reveal && hasVoice();
    qt = hideQ ? `<span class="muted" style="font-size:15px">Pertanyaan dibacakan di akhir audio. Pilih jawaban yang paling tepat.</span>` : esc(b.q);
    opts=b.o;
  }
  else { qt = esc(b.q); opts=b.o; }
  const optHTML = opts.map((o,i)=>{
    let c="opt"; if(chosen===i) c+=" sel";
    if(reveal){ if(i===b.a) c+=" right"; else if(chosen===i) c+=" wrong"; }
    return `<button class="${c}" data-act="ans" data-v="${i}" ${reveal&&T&&T.feedback?"disabled":""}><span class="bub">${L[i]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  return {qt,optHTML};
}
function explainHTML(b, chosen){
  const ok = chosen===b.a;
  const fix = b.type==="we" ? ` Bagian yang salah adalah <b>(${L[b.a]}) ${esc(weParts(b)[b.a])}</b>, seharusnya <b>${esc(b.f)}</b>.` : ` Jawaban benar: <b>(${L[b.a]})</b>.`;
  return `<div class="explain"><b class="v ${ok?"ok":"bad"}">${chosen===undefined?"Tidak dijawab.":ok?"Benar.":"Belum tepat."}</b>${fix} ${esc(b.e)}${b.type==="ls"?transcriptHTML(b):""}</div>`;
}
function skillLabel(b){
  const name=esc(SKILLS[b.type][b.s]);
  if(b.type==="ls") return `LISTENING · PART ${b.part} · ${name}`;
  if(b.type==="vc") return `FLASH CARD · ${name.toUpperCase()}`;
  return `${b.type==="st"?"STRUCTURE":b.type==="we"?"WRITTEN EXPRESSION":"READING"} · SKILL ${b.s} · ${name}`;
}
function audioPanel(b){
  const ctx = b.part!=="A" ? `<p class="muted" style="font-size:13px;margin:0">${esc(LSG[b.gid].title)} · soal ${b.qi+1} dari ${LSG[b.gid].q.length}</p>` : "";
  if(!hasVoice()){
    return `<div class="audio">${ctx}<p class="warn" style="margin:0">Suara text-to-speech tidak tersedia di perangkat ini, jadi naskah audio ditampilkan sebagai teks.</p>${transcriptHTML(b).replace("<details","<details open")}</div>`;
  }
  const playing=TTS.on;
  let ctrl;
  if(T.mode==="sim"){
    const kind=simKind(b), done=T.played[audioKey(b,kind)];
    ctrl = playing ? `<span class="pulse">Audio sedang diputar…</span>`
      : done ? `<span class="muted">Audio sudah diputar. Dalam simulasi, audio hanya bisa didengar sekali.</span>`
      : `<button class="btn primary" data-act="play" data-v="${kind}">▶ Putar audio</button>`;
  } else {
    ctrl = playing ? `<span class="pulse">Audio sedang diputar…</span><button class="btn" data-act="stop">■ Hentikan</button>`
      : b.part==="A" ? `<button class="btn primary" data-act="play" data-v="item">▶ Putar audio</button>`
      : `<button class="btn primary" data-act="play" data-v="group">▶ Putar ${b.part==="B"?"percakapan":"talk"} + pertanyaan</button><button class="btn" data-act="play" data-v="item">↻ Pertanyaan saja</button>`;
  }
  return `<div class="audio">${ctx}<div class="row">${ctrl}</div></div>`;
}

function test(){
  const id=T.items[T.idx], b=byId[id], chosen=T.ans[id];
  const reveal = T.feedback && chosen!==undefined;
  const {qt,optHTML}=questionBody(b,chosen,reveal);
  const answered=Object.keys(T.ans).length;
  const pct = Math.round(100*answered/T.items.length);
  let dir="";
  if(b.type==="st" && (T.idx===0 || byId[T.items[T.idx-1]].type!=="st")) dir="Structure: pilih kata atau frasa yang melengkapi kalimat dengan benar.";
  if(b.type==="we" && (T.idx===0 || byId[T.items[T.idx-1]].type!=="we")) dir="Written Expression: pilih bagian bergaris yang harus diperbaiki agar kalimat benar.";
  if(b.type==="ls" && (T.idx===0 || byId[T.items[T.idx-1]].part!==b.part)) dir={A:"Part A: dengarkan percakapan pendek dan pertanyaannya, lalu pilih jawaban yang paling tepat.",B:"Part B: dengarkan percakapan yang lebih panjang. Setiap percakapan diikuti beberapa pertanyaan.",C:"Part C: dengarkan talk atau kuliah singkat. Setiap talk diikuti beberapa pertanyaan."}[b.part];
  const grid = !T.feedback ? `<div class="grid" aria-label="Navigasi soal">${T.items.map((x,i)=>`<button class="cell ${T.ans[x]!==undefined?"ans":""} ${T.flag[x]?"flag":""} ${i===T.idx?"cur":""}" data-act="go" data-v="${i}" aria-label="Soal ${i+1}">${i+1}</button>`).join("")}</div>` : "";
  const last = T.idx===T.items.length-1;
  const q = `<div class="qcard">
     <div class="qhead"><span class="qtag">${skillLabel(b)}</span><span class="qtag num">${T.idx+1} / ${T.items.length}</span></div>
     ${dir?`<p class="muted" style="font-size:13px;margin-bottom:10px">${dir}</p>`:""}
     ${b.type==="ls"?audioPanel(b):""}
     <div class="qtext">${qt}</div>
     <div class="opts">${optHTML}</div>
     ${reveal?explainHTML(b,chosen):""}
     <div class="nav">
       <button class="btn ghost" data-act="prev" ${T.idx===0?"disabled":""}>← Sebelumnya</button>
       <div class="row">
         ${!T.feedback?`<button class="btn ghost" data-act="flag">${T.flag[id]?"Hapus tanda":"Tandai ragu"}</button>`:""}
         ${last? `<button class="btn primary" data-act="ask-finish">Selesai</button>` : `<button class="btn ${reveal||!T.feedback?"primary":""}" data-act="next">Berikutnya →</button>`}
       </div>
     </div>
     ${T.confirm?`<div class="confirm"><p>${T.items.length-answered>0?`Masih ada <b>${T.items.length-answered}</b> soal belum dijawab. `:""}Kumpulkan jawaban sekarang?</p><div class="row" style="margin-top:10px"><button class="btn primary" data-act="finish">Ya, kumpulkan</button><button class="btn ghost" data-act="cancel-finish">Kembali</button></div></div>`:""}
     ${grid}
   </div>`;
  const body = b.type==="rd" ? `<div class="stage split"><article class="passage" id="passage">${passageHTML(passage(b.pid), b.hl)}</article>${q}</div>` : `<div class="stage" style="max-width:760px;margin-inline:auto;margin-top:20px">${q}</div>`;
  return `<div class="bar"><div class="inner">
      <button class="btn ghost" data-act="ask-finish" title="Akhiri sesi">✕</button>
      <div class="title">${esc(T.title)}<small>${esc(T.sub)}</small></div>
      ${T.endsAt?`<span class="timer" id="timer" aria-live="off">${fmt(T.endsAt-Date.now())}</span>`:`<span class="timer num">${answered}/${T.items.length}</span>`}
    </div><div class="progress"><i style="width:${pct}%"></i></div></div>
    <div class="wrap" style="padding-top:0">${body}</div>`;
}

function result(){
  const R=T.result;
  const bySkill={};
  R.res.forEach(r=>{const b=byId[r.id]; const k=b.type+"-"+b.s; (bySkill[k]=bySkill[k]||{b,n:0,ok:0}); bySkill[k].n++; if(r.ok) bySkill[k].ok++;});
  const rows=Object.values(bySkill).sort((x,y)=>(x.ok/x.n)-(y.ok/y.n));
  const pct=Math.round(100*R.raw/R.total);
  const list = R.res.map((r,i)=>({...r,i})).filter(r=>T.filter==="all"||(T.filter==="wrong"&&!r.ok));
  return `<div class="wrap">
    <div class="row" style="justify-content:space-between;margin-bottom:16px"><div><div class="eyebrow">Hasil</div><h2>${esc(T.title)}</h2></div><button class="btn" data-act="home">Kembali ke beranda</button></div>
    <div class="result-top">
      <div>${R.scaled!==undefined?`<div class="eyebrow">Skor skala ITP</div><div class="bigscore">${R.scaled}</div><p class="muted num" style="margin-top:6px">${R.raw} benar dari ${R.total} (${pct}%)</p>`:`<div class="eyebrow">Benar</div><div class="bigscore">${R.raw}<small> / ${R.total}</small></div><p class="muted num" style="margin-top:6px">${pct}%</p>`}</div>
      <div><h3 style="margin-bottom:10px">Penguasaan per skill <span class="muted" style="font-weight:400;font-size:13px">(paling lemah di atas)</span></h3>
        <div class="bars">${rows.slice(0,10).map(r=>{const p=Math.round(100*r.ok/r.n);return `<div class="sbar"><span>${r.b.type==="rd"?"R":r.b.type==="ls"?"L":""}${r.b.s}.${esc(SKILLS[r.b.type][r.b.s])}</span><span class="track"><i class="${p<60?"lo":""}" style="width:${p}%"></i></span><span class="num">${r.ok}/${r.n}</span></div>`}).join("")}</div>
        ${rows.length>10?`<p class="muted" style="font-size:12.5px;margin-top:6px">Menampilkan 10 skill terlemah dari ${rows.length}.</p>`:""}
      </div>
    </div>
    <div class="section-title"><h2>Pembahasan</h2><div class="tabs"><button class="tab" data-act="filter" data-v="all" aria-pressed="${T.filter==="all"}">Semua</button><button class="tab" data-act="filter" data-v="wrong" aria-pressed="${T.filter==="wrong"}">Hanya yang salah (${R.res.filter(r=>!r.ok).length})</button></div></div>
    <div class="review">${list.map(r=>{const b=byId[r.id]; const {qt,optHTML}=questionBody(b,r.ans,true);
      return `<div class="ritem ${r.ok?"":"bad"}"><div class="qhead"><span class="qtag">No. ${r.i+1} · ${skillLabel(b)}</span>${b.type==="rd"?`<span class="qtag">${esc(passage(b.pid).title)}</span>`:""}</div><div class="qtext">${qt}</div>${b.type!=="we"?`<div class="opts">${optHTML.replace(/<button/g,'<button disabled')}</div>`:""}${explainHTML(b,r.ans)}</div>`}).join("") || `<p class="note">Semua jawaban benar.</p>`}</div>
    <div class="row" style="margin-top:20px"><button class="btn primary" data-act="home">Kembali ke beranda</button>${Object.keys(store.wrong).length?`<button class="btn" data-act="mistakes">Ulangi soal yang salah</button>`:""}</div>
  </div>`;
}

/* =========================================================
   EVENTS
   ========================================================= */
$app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case "tab": ui.tab=v; ui.picked=new Set(); render(); break;
    case "pick": { const key = (ui.tab==="rd"||ui.tab==="ls")? v : +v; ui.picked.has(key)?ui.picked.delete(key):ui.picked.add(key); render(); break; }
    case "sim1": sim1(); break;
    case "fc-open": startCards(v); break;
    case "fc-deck": startCards(v); break;
    case "fc-only": ui.fc.only=!ui.fc.only; startCards(); break;
    case "fc-dir": ui.fc.dir = ui.fc.dir==="en"?"id":"en"; ui.fc.flip=false; render(); break;
    case "flip": ui.fc.flip=!ui.fc.flip; render(); break;
    case "rate": rateCard(+v); break;
    case "say": { const c=cardById[ui.fc.queue[ui.fc.i]]; if(c) sayCard(v==="ex"?c.ex:c.w); break; }
    case "fc-quiz": cardQuiz(); break;
    case "fc-quizdeck": ui.fc=Object.assign({deck:"v",only:false,dir:"en"},ui.fc||{},{deck:v}); cardQuiz(); break;
    case "fc-restart": startCards(); break;
    case "play": playFor(byId[T.items[T.idx]], v); break;
    case "stop": stopSpeech(); render(); break;
    case "tts-test": speak([{who:"W",text:"Hello! This is the woman's voice for the listening section."},{who:"M",text:"And this is the man's voice. Good luck with your practice."},{who:"N",text:"What does the man wish the listener?"}],"test"); break;
    case "clear": ui.picked=new Set(); render(); break;
    case "practice": practice(); break;
    case "sim2": sim2(); break;
    case "sim3": sim3(); break;
    case "mistakes": mistakes(); break;
    case "ans": choose(+v); break;
    case "next": go(T.idx+1); scrollQ(); break;
    case "prev": go(T.idx-1); scrollQ(); break;
    case "go": go(+v); break;
    case "flag": { const id=T.items[T.idx]; T.flag[id]=!T.flag[id]; render(); break; }
    case "ask-finish": T.confirm=true; render(); break;
    case "cancel-finish": T.confirm=false; render(); break;
    case "finish": finish(); break;
    case "home": stopSpeech(); ui.screen="home"; T=null; clearInterval(tick); render(); window.scrollTo(0,0); break;
    case "filter": T.filter=v; render(); break;
    case "reset": ui.confirmReset=true; render(); break;
    case "reset-no": ui.confirmReset=false; render(); break;
    case "reset-yes": store={...store,history:[],wrong:{}}; save(store); ui.confirmReset=false; render(); break;
  }
});
$app.addEventListener("change",e=>{
  if(e.target.id==="count"){ ui.count = e.target.value==="all"?"all":+e.target.value; render(); }
  if(e.target.id==="rate"){ store.rate=+e.target.value; save(store); }
});
function scrollQ(){ const q=document.querySelector(".qcard"); if(q && q.getBoundingClientRect().top<0) q.scrollIntoView({block:"start"}); }
document.addEventListener("keydown",e=>{
  if(ui.screen==="cards" && ui.fc && ui.fc.i<ui.fc.queue.length && e.target.tagName!=="SELECT"){
    if(e.key===" " || (e.key==="Enter" && e.target.tagName!=="BUTTON")){ e.preventDefault(); ui.fc.flip=!ui.fc.flip; render(); }
    else if(ui.fc.flip && ["1","2","3"].includes(e.key)) rateCard(+e.key);
    return;
  }
  if(ui.screen!=="test"||!T||e.target.tagName==="SELECT") return;
  const k=e.key.toUpperCase();
  if("ABCD".includes(k)&&k.length===1){ choose("ABCD".indexOf(k)); }
  else if(e.key==="ArrowRight") go(T.idx+1);
  else if(e.key==="ArrowLeft") go(T.idx-1);
});
render();
</script>

</body></html>
